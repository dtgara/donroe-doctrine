rounds:

  - round_id: 1
    event: "Campaign announcement speech, Trump Tower, New York — June 16, 2015"
    quotes:
      - text: "Mexico is not sending its best people. They're sending people that have lots of problems, and they're bringing those problems with us. They're bringing drugs. They're bringing crime. They're rapists. And some, I assume, are good people."
        real: true
      - text: "Mexico has been taking advantage of the United States for so long, frankly it's embarrassing. Their leaders are much smarter than ours. That I can tell you. Much, much smarter."
        real: false
      - text: "I know the Mexican people. Beautiful people. But their government? Their government is ripping us apart. Every single day. It's a disaster, what's happening. A total disaster."
        real: false
      - text: "We build a wall, we stop the drugs, we stop the crime. It's very simple. People say it can't be done. It can absolutely be done. Nobody builds better than Trump, believe me."
        real: false
    source: "https://www.washingtonpost.com/news/post-politics/wp/2015/06/16/full-text-donald-trump-announces-a-presidential-bid/"
    reveal_note: "The opening salvo. Delivered on June 16, 2015, it set the template for everything that followed."

  - round_id: 2
