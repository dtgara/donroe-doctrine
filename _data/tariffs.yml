- country: European Union
  code: EU
  categories:
  - product: All goods (general)
    rate_percent: 10
    effective_date: '2026-07-24'
    change_count: 6
    term: 2
    doctrine_assessment: The Supreme Court ruled the IEEPA tariffs unlawful on February
      20, 2026. A temporary 10 percent surcharge followed and expired on July 24,
      when a flat Section 301 rate replaced it. The EU rate is 10 percent all-in,
      capped. Autos are 15 percent. Retaliatory lists were prepared and, for the moment,
