- country: China
  code: CN
  categories:
  - product: All goods (general)
    rate_percent: 12.5
    effective_date: '2026-07-24'
    change_count: 12
    term: 2
    doctrine_assessment: The Supreme Court ruled the IEEPA tariffs unlawful on February
      20, 2026. A temporary 10 percent surcharge followed and expired on July 24,
      when a flat Section 301 rate replaced it. The rate is 12.5 percent, stacked
      on the 2018-era Section 301 tariffs. The 145 percent figure is documented separately
      as a historical peak.
  - product: All goods (Liberation Day peak, historical)
    rate_percent: 145
    effective_date: '2025-04-09'
    change_count: 9
    term: 2
    doctrine_assessment: The rate was described as necessary, retaliatory, and the
      highest in history. It was reduced to 30 percent after the Geneva talks. The
      145 percent figure endured for 34 days. The tariff authority that produced it
      no longer exists. This is documented here at its peak.
  - product: Steel
    rate_percent: 50
    effective_date: '2025-06-04'
    change_count: 3
    term: 1
    doctrine_assessment: Section 232 tariff applied on national security grounds.
      China was not the only target; the measure was global. It is listed here because
      China was the implied primary concern. Raised to 50 percent on June 4, 2025,
      and charged on full product value from April 6, 2026.
  - product: Solar panels
    rate_percent: 30
    effective_date: '2018-02-07'
    change_count: 3
    term: 1
    doctrine_assessment: Section 201 safeguard tariff. Applied to protect domestic
      manufacturers. Extended and modified in subsequent years.
- country: Canada
  code: CA
  categories:
  - product: All goods (general)
    rate_percent: 10
    effective_date: '2026-07-24'
    change_count: 9
    term: 2
    doctrine_assessment: The Supreme Court ruled the IEEPA tariffs unlawful on February
      20, 2026. A temporary 10 percent surcharge followed and expired on July 24,
      when a flat Section 301 rate replaced it. Canada pays 10 percent on goods outside
      the USMCA. The 51st state framing has not been withdrawn.
  - product: Steel and aluminium
    rate_percent: 50
    effective_date: '2025-06-04'
    change_count: 3
    term: 2
    doctrine_assessment: Applied under Section 232. Canada was exempted from Term
      1 steel tariffs under the USMCA renegotiation. The exemption was not extended
      in Term 2. Raised to 50 percent on June 4, 2025, and charged on full product
      value from April 6, 2026.
  - product: Automobiles
    rate_percent: 25
    effective_date: '2025-04-03'
    change_count: 1
    term: 2
    doctrine_assessment: Applied under the broader auto tariff order. Canada's integrated
      supply chains with the US auto industry were acknowledged; the tariff was applied
      regardless.
  - product: Listed goods (Section 338)
    rate_percent: 50
    effective_date: '2026-08-22'
    change_count: 1
    term: 2
    doctrine_assessment: The first modern use of Section 338 of the Tariff Act of
      1930. Announced July 20, delayed three days, applied to dairy, alcohol, furniture
      and machinery, including goods that qualify under USMCA. Canada retaliated.
      Import bans followed on September 29. A court challenge was filed October 20.
      The framework treaty survives. The goods do not cross.
