- country: Australia
  code: AU
  categories:
  - product: All goods (general)
    rate_percent: 10
    effective_date: '2025-04-05'
    change_count: 1
    term: 2
    doctrine_assessment: Base Liberation Day rate. Australia runs a trade deficit
      with the US, meaning it buys more from the US than it sells. The 10 percent
      tariff was applied regardless. Australia did not retaliate. The IEEPA basis
      for this rate ended with the February 2026 Supreme Court ruling. The current
      rate has not been independently confirmed.
