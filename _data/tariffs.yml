  - product: Steel and aluminium
    rate_percent: 50
    effective_date: '2025-06-04'
    change_count: 3
    term: 1
    doctrine_assessment: Applied after exemption expired. EU retaliated with tariffs
      on Harley-Davidson, bourbon, and jeans. Described at the time as the beginning
      of a trade war that would be easy to win. Raised to 50 percent on June 4, 2025,
      and charged on full product value from April 6, 2026.
  - product: Automobiles
    rate_percent: 15
    effective_date: '2025-04-03'
    change_count: 2
    term: 2
    doctrine_assessment: Germany's automotive exports are the primary target. The
      EU's €6 billion retaliatory list was prepared in response. Capped at 15 percent
      all-in under the 2025 framework.
