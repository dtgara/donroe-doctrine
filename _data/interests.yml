# The Interests — Trump Family Foreign Business Register
# Documents foreign business deals, investments, and commercial entanglements
# of the Trump family and affiliated parties during both presidential terms.
# Distinct from The Ledger (payments received): these are assets, stakes, and
# developments built or acquired in countries subject to US foreign policy.
# Last updated: 2026-06-27

