# The Expansion — Territorial & Regime-Change Register
# Documents countries and territories the administration has publicly
# threatened to annex, absorb, or subject to regime change, and tracks each
# through an escalation ladder: rhetorical claim -> economic pressure ->
# military threat -> military action -> regime change achieved.
# Press independently coined "Don-roe Doctrine" for this exact pattern
# (New York Post, later CBS News) after the Venezuela operation -- a
# near-identical pun to this site's own name.
# Last updated: 2026-07-10

snapshot_note: >-
  Escalation level reflects the highest rung reached to date, not
  necessarily the current state -- some targets have cooled (Canada),
  some are frozen mid-threat (Greenland), and some have reached the top
  of the ladder (Venezuela). Level definitions: 1 rhetorical claim, 2
  economic pressure (tariffs/sanctions/financial leverage), 3 military
  threat, 4 military action, 5 regime change achieved.

targets:

  - id: greenland
    name: Greenland
    code: GL
    region: Arctic
    claim_type: [territorial_annexation]
    escalation_level: 3
    escalation_label: "Military threat"
    rationale_claimed: "National security — Arctic shipping lanes and Russian/Chinese activity nearby"
    current_status: "Unresolved. Special envoy appointed; White House confirms 'range of options including military force' under discussion as of Jan 2026. Rhetoric revived at the July 2026 NATO summit with no new concrete step. Denmark and Greenland both refuse."
    target_response: "Greenland's PM called annexation talk 'fantasies.' Denmark and European allies issued a joint statement defending 'sovereignty, territorial integrity and inviolability of borders.'"
    first_asserted_date: "2019-08-15"
    last_updated_date: "2026-07-08"

  - id: canada
    name: Canada
    code: CA
    region: North America
    claim_type: [territorial_annexation, economic_coercion]
    escalation_level: 2
    escalation_label: "Economic pressure"
    rationale_claimed: "Trade imbalance; repeated framing of Canada as a natural '51st state'"
    current_status: "Rhetoric on absorption has cooled since late 2025, but economic pressure escalated sharply on July 20, 2026 with new 50% tariffs on roughly $20 billion of Canadian autos, alcohol, dairy, and other goods (see deals.yml us-canada-tariffs-2026), effective in 30 days. No military threat made."
    target_response: "PM Mark Carney has been unambiguous that Canada has no interest in joining the US. Ontario pulled an anti-tariff ad after Trump threatened to end trade talks over it. On the July 2026 tariffs, Carney said Canada believes in 'the benefits of free and fair trade' and remains open to negotiation."
    first_asserted_date: "2024-11-15"
    last_updated_date: "2026-07-20"

  - id: panama
    name: Panama (Canal)
    code: PA
    region: Central America
    claim_type: [territorial_annexation, economic_coercion]
    escalation_level: 2
    escalation_label: "Economic pressure"
    rationale_claimed: "Historic US construction and defense of the canal; claims of Chinese influence over canal operations"
    current_status: "Claims the canal was 'reclaimed' via a BlackRock-led consortium's purchase of a controlling stake in the company operating nearby ports. Panama's government disputes this is equivalent to control of the canal itself. Grievance revived rhetorically at the July 2026 Roosevelt library dedication with no new concrete action."
    target_response: "Panama's president publicly accused Trump of 'lying' about reclaiming the canal."
    first_asserted_date: "2024-12-21"
    last_updated_date: "2026-07-01"

  - id: gaza
    name: Gaza
    code: PS
    region: Middle East
    claim_type: [territorial_annexation]
    escalation_level: 1
    escalation_label: "Rhetorical claim"
    rationale_claimed: "Redevelopment — described as turning a 'territory of death and destruction' into a US-run 'freedom zone'"
    current_status: "Proposal reiterated multiple times, no concrete US territorial action taken. Distinct from the broader Israel-Hamas ceasefire/hostage process, which is tracked separately."
    target_response: "Widely rejected by Arab states and Palestinian officials as a displacement plan."
    first_asserted_date: "2025-02-04"
    last_updated_date: "2025-05-15"

  - id: venezuela
    name: Venezuela
    code: VE
    region: South America
    claim_type: [regime_change, military_intervention]
    escalation_level: 5
    escalation_label: "Regime change achieved"
    rationale_claimed: "Counter-narcotics — Maduro government designated a drug-trafficking enterprise"
    current_status: "January 2026: US military operation captured Maduro in Caracas; he now faces drug trafficking charges in the US. Interim government installed. This is the case that prompted the press to coin 'Don-roe Doctrine.'"
    target_response: "Cuban government reported 32 Cuban nationals (Maduro's bodyguard/intelligence detail) killed in the operation. Colombia's Petro warned against similar action in his own country."
    first_asserted_date: "2025-08-01"
    last_updated_date: "2026-01-11"

  - id: cuba
    name: Cuba
    code: CU
    region: Caribbean
    claim_type: [economic_coercion, regime_change]
    escalation_level: 2
    escalation_label: "Economic pressure"
    rationale_claimed: "Regime collapse framed as a byproduct of cutting off Cuba's Venezuelan oil lifeline, not direct US action"
    current_status: "No direct military threat made. Trump has publicly predicted the government will 'fall' on its own once Venezuelan oil support ends, repeating in July 2026 that Cuba is 'coming our way.' Rubio: Cuban leaders 'in a lot of trouble.'"
    target_response: "President Diaz-Canel said Cuba would resist any US military intervention 'to the very last drop of blood.' Cuba's foreign minister brought a formal complaint over the US pressure campaign before the UN General Assembly on July 7, 2026."
    first_asserted_date: "2026-01-11"
    last_updated_date: "2026-07-01"

  - id: colombia
    name: Colombia
    code: CO
    region: South America
    claim_type: [economic_coercion, military_intervention]
    escalation_level: 3
    escalation_label: "Military threat"
    rationale_claimed: "Counter-narcotics — accused President Petro of allowing cocaine production to flourish"
    current_status: "Sanctions imposed on Petro (Oct 2025); over 115 people killed in US strikes on alleged drug boats. When asked directly if military action against Colombia was being threatened, Trump said 'it sounds good to me.' In a July 2026 call focused on coca eradication, Petro personally asked Trump to lift his own sanctions listing; Trump said he would 'do his best.'"
    target_response: "Petro accused the US of violating international law with the boat strikes and said he 'would take up arms' for his country if necessary, despite having sworn off violence."
    first_asserted_date: "2025-10-01"
    last_updated_date: "2026-07-03"

  - id: iran
    name: Iran
    code: IR
    region: Middle East
    claim_type: [military_intervention, regime_change]
    escalation_level: 4
    escalation_label: "Military action"
    rationale_claimed: "Nuclear non-proliferation — prevention of an Iranian nuclear weapon"
    current_status: "US airstrikes hit Fordo, Natanz, and Isfahan nuclear facilities (June 2025) during a broader Israel-Iran war. A 2026 wave of Iranian protests drew a further Trump threat to 'come to the rescue.' A June 2026 ceasefire broke down in early July after tanker attacks in the Strait of Hormuz; Trump declared the truce 'over' and US forces struck roughly 90 Iranian targets over two days, though talks continued. On July 13 Trump reinstated the naval blockade of Iran and announced a 20% Hormuz transit toll billed as a 'guardian' fee; he dropped the toll a day later citing pending Gulf state investment pledges, while the blockade remained in effect. Iranian ballistic missile and drone attacks killed three US service members in Jordan and one in Iraq on July 17-19; Trump vowed retaliation and, on July 22, threatened to destroy an Iranian bridge or power plant for every future attack on Hormuz shipping. The administration formally notified Congress that a new 60-day war-powers window had begun, a position congressional Democrats dispute (see deals.yml us-iran-mou-2026)."
    target_response: "Iran denied it was close to a weapon; DNI Gabbard's own intelligence assessment publicly contradicted Trump's stated justification for the strikes (see Contradiction Tracker). Iran maintains it holds sovereignty over Strait of Hormuz shipping routes and rejected any US role administering it; Iranian FM Araghchi sarcastically endorsed the toll principle while calling 20% 'too much.' Iran's supreme leader called Trump's signature on the June MOU 'worthless' after the ceasefire collapsed. Araghchi said Iran's defense doctrine is 'eye for an eye' and that any strike on its infrastructure 'will compel a powerful and decisive response.'"
    first_asserted_date: "2025-02-28"
    last_updated_date: "2026-07-22"

incidents:

  - id: exp001
    date: "2019-08-15"
    target_id: [greenland]
    type: annexation_threat
    escalation_level: 1
    headline: "First floats purchasing Greenland from Denmark"
    detail: "During his first term, Trump confirmed he was considering buying Greenland from Denmark, citing strategic interest. Danish PM Mette Frederiksen called the idea 'absurd,' prompting Trump to cancel a state visit to Denmark in response."
    quote: "Denmark essentially owns it. We're a very good ally... and we'll start thinking about Denmark."
    quoted_by: "Donald Trump"
    source: "Multiple outlets, Aug 2019"
    source_url: "https://en.wikipedia.org/wiki/American_expansionism_under_Donald_Trump"
    doctrine_note: "The idea predates the doctrine's official start date but is included as the origin point of the Greenland claim, which resumed with much greater intensity in the second term."

  - id: exp002
    date: "2025-01-07"
