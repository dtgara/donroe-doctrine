    detail: "In the same Roosevelt library address, Trump claimed Cuba was moving toward the United States without elaborating on what prompted the assessment. Cuban President Miguel Diaz-Canel responded days later that Cuba would resist any US military intervention 'to the very last drop of blood,' and Cuba's foreign minister brought a formal complaint over the US pressure campaign to the UN General Assembly on July 7."
    quote: "Speaking of Cuba, after many, many decades, it's coming our way."
    quoted_by: "Donald Trump"
    source: "AOL News / Reuters"
    source_url: "https://www.aol.com/news/trump-claims-cuba-coming-way-084608818.html"
    doctrine_note: "Echoes the January 2026 'ready to fall' prediction (exp incident on 2026-01-11) with no intervening concrete pressure escalation."

  - id: exp020
    date: "2026-07-08"
    target_id: [greenland]
    type: annexation_threat
    escalation_level: 1
    headline: "Revives Greenland claim at NATO summit, laments 1951 handback"
    detail: "Seated beside NATO Secretary General Mark Rutte in Ankara, Trump renewed his case for US control of Greenland, framing the island's return to Denmark after US wartime administration as a historic mistake and tying his frustration to unrelated complaints about NATO allies' posture on Iran."
    quote: "We took Greenland and then, stupidly, we gave it back. We shouldn't have given it back to them, because we're the ones that need it. We need it for protection of the world, not just the United States."
    quoted_by: "Donald Trump"
    source: "Bloomberg"
    source_url: "https://www.bloomberg.com/news/articles/2026-07-08/trump-s-greenland-obsession-returns-stupidly-we-gave-it-back"
    doctrine_note: "Danish PM Mette Frederiksen reiterated that Greenland 'is, of course, not for sale' in response, consistent with Denmark's standing position."

  - id: exp021
    date: "2026-07-08"
    target_id: [iran]
    type: military_action
    escalation_level: 4
    headline: "Declares June ceasefire 'over' after tanker attacks and renews strikes"
    detail: "After Iranian forces attacked three commercial oil tankers near the Strait of Hormuz, US and Iranian forces exchanged strikes for a second straight day, with American forces hitting roughly 90 Iranian targets. Trump declared the ceasefire reached the prior month at an end while saying talks could continue. Oil prices rose more than 6% on the news."
    quote: null
    quoted_by: null
    source: "Washington Post / NBC News"
    source_url: "https://www.washingtonpost.com/world/2026/07/08/trump-declares-ceasefire-with-iran-has-ended/"
    doctrine_note: "Matches the existing roster ceiling set by the February 2025 Fordo/Natanz/Isfahan strikes; the underlying dispute is control of the Strait of Hormuz."

  - id: exp022
    date: "2026-07-03"
    target_id: [colombia]
    type: economic_coercion
    escalation_level: 2
    headline: "Petro asks Trump to lift his own OFAC sanctions listing"
    detail: "In a phone call focused on coca eradication targets, outgoing Colombian President Gustavo Petro asked Trump to remove him and his family from the US sanctions list imposed in October 2025. Trump said he would 'do his best.' Colombia reported eradicating roughly 30,000 hectares of coca under a voluntary program, with a year-end target of 41,000."
    quote: "I'll do my best."
    quoted_by: "Donald Trump"
    source: "Reuters"
    source_url: "https://www.usnews.com/news/top-news/articles/2026-07-03/colombias-petro-discusses-anti-drug-efforts-sanctions-list-with-trump"
    doctrine_note: "The sanctioned leader personally petitioning for relief marks a inversion of the October 2025 escalation (exp incident) rather than a new pressure rung."
  - id: exp023
    date: "2026-07-13"
    target_id: [iran]
    type: military_action
    escalation_level: 4
    headline: "Reinstates naval blockade of Iran, declares US 'guardian' of Hormuz with 20% toll"
    detail: "After a week of renewed US-Iran strikes that unraveled the June ceasefire MOU, Trump announced on Truth Social and in a Fox News interview that the US would reinstate what he called 'THE IRANIAN BLOCKADE' of the Strait of Hormuz beginning at 20:00 GMT the following day — reversing the MOU provision that had reopened the strait. He simultaneously declared the US would become 'GUARDIAN OF THE HORMUZ STRAIT' and charge a 20% reimbursement toll on all cargo shipped through it. Secretary of State Rubio and Vice President Vance had rejected the legality of such tolls the prior month; the UN's International Maritime Organization said the plan had no legal basis. Iran's joint military command warned any US interference in strait management would be treated as an act of war."
    quote: "We are reinstating THE IRANIAN BLOCKADE, so named because it is only stopping Iran's ships or customers from entering or leaving... The U.S.A. will be, from this point forward, known as 'THE GUARDIAN OF THE HORMUZ STRAIT,' but as such, and as a matter of FAIRNESS, will be reimbursed, at the rate of 20% on all cargo shipped, for any and all costs necessary to do the job of providing safety and security to this very volatile section of the World."
    quoted_by: "Donald Trump"
    source: "Al Jazeera"
    source_url: "https://www.aljazeera.com/news/2026/7/13/trump-says-us-will-become-guardian-of-strait-of-hormuz-and-collect-tolls"
    doctrine_note: "Matches the existing roster ceiling set by the June 2025 Fordo/Natanz/Isfahan strikes; folds an economic-coercion instrument (the toll) into an already-active military posture rather than opening a new rung."

  - id: exp024
    date: "2026-07-14"
    target_id: [iran]
    type: economic_coercion
    escalation_level: 2
    headline: "Drops 20% Hormuz toll a day after announcing it, cites Gulf investment pledges"
    detail: "Trump reversed the prior day's toll announcement, posting that he had replaced the '20% United States Reimbursement Fee' with trade and investment deals from Gulf states, and telling reporters the money would come 'primarily' from the UAE, Saudi Arabia, Qatar, Kuwait, and Bahrain. The naval blockade reinstatement announced alongside the toll (exp023) was not withdrawn. Iranian Foreign Minister Araghchi had mockingly endorsed the underlying principle on X, and Brazilian President Lula da Silva had called the toll plan 'piracy' hours earlier."
    quote: "Based on highly productive conversations with Middle East leadership, I have decided to replace the 20% United States Reimbursement Fee with Trade and Investment Deals that the various Gulf States will be making into the United States."
    quoted_by: "Donald Trump"
    source: "The National / PBS NewsHour"
    source_url: "https://www.thenationalnews.com/business/energy/2026/07/14/trump-abandons-20-hormuz-toll-in-favour-of-deal-with-gulf-states/"
    doctrine_note: "The reversal was itself reversed rhetorically at the same press conference, where Trump argued no country -- including the US -- should charge strait tolls, directly contradicting his own statement one day earlier."

  - id: exp025
    date: "2026-07-20"
    target_id: [iran]
    type: military_action
    escalation_level: 4
    headline: "Three US troops killed in Iranian attack on Jordan base; Trump vows Iran will 'pay many times over'"
    detail: "Iranian ballistic missile and drone attacks on Muwaffaq Salti Air Base in Jordan killed 1st Lt. Tyler James Feehan, Pvt. Isabella Gonzales, and Sgt. Angel S. Rampersad on July 17-18; a fourth service member, Michael Emmanuel Swinton, was killed in Erbil, Iraq on July 19 during a controlled detonation of a downed Iranian drone. Nearly 100 additional service members were injured. The US and Iran traded further strikes in the aftermath."
    quote: "Every time Iran kills an American Soldier they will pay for that killing many times over!"
    quoted_by: "Donald Trump (Truth Social)"
    source: "Al Jazeera / NPR / Military Times"
    source_url: "https://www.aljazeera.com/news/2026/7/20/trump-vows-iran-will-pay-for-killing-us-soldiers"
    doctrine_note: "The first US combat fatalities from Iranian fire since the March ceasefire violations, occurring five weeks after Trump called the June MOU an 'unconditional surrender' by 'the smartest group' Iran had ever fielded (see Contradiction Tracker c063)."

  - id: exp026
    date: "2026-07-22"
    target_id: [iran]
    type: military_force_threat
    escalation_level: 3
    headline: "Threatens to bomb an Iranian bridge or power plant for every future Hormuz attack"
    detail: "Following Iranian attacks on more than 30 commercial vessels over the preceding three months, Trump announced a standing retaliation policy targeting Iranian infrastructure, including sites 'next to or inside' Tehran, for any further attack on Hormuz shipping. UN Secretary-General Guterres called such attacks on infrastructure 'unacceptable' under international law absent a military use justification."
    quote: "From this point forward, anytime the Islamic Republic of Iran fires on a ship in the Strait of Hormuz, whether with a missile, rocket, drone, or any other weapon, the United States will bomb and destroy a bridge or power plant."
    quoted_by: "Donald Trump (Truth Social)"
    source: "Axios / PBS NewsHour / Al Jazeera"
    source_url: "https://www.axios.com/2026/07/22/trump-iran-bridges-power-plants-hormuz"
    doctrine_note: "A blanket, pre-announced infrastructure-targeting policy rather than a response to a specific attack -- the threat itself, not any single incident, is the escalation."

  - id: exp027
    date: "2026-07-20"
    target_id: [canada]
    type: economic_coercion
    escalation_level: 2
    headline: "Announces 50% tariffs on most Canadian goods, effective in 30 days"
    detail: "Trump imposed 50% tariffs on roughly $20 billion of Canadian goods -- autos, alcohol, dairy, cement, and hockey sticks among them -- effective in 30 days, invoking Section 338 of the Tariff Act of 1930 and citing Canadian trade practices he characterized as discriminatory against American autos, alcohol, and dairy producers. Oil, gas, critical minerals, potash, and goods already covered by sector-specific tariffs were exempted."
    quote: null
    quoted_by: null
    source: "Washington Post / NPR / Al Jazeera"
    source_url: "https://www.washingtonpost.com/business/2026/07/20/trump-says-he-will-impose-50-percent-tariffs-canada/"
    doctrine_note: "The steepest single tariff action against Canada in the register to date, arriving nine months after the last documented escalation (exp009) and reversing the 'rhetoric has cooled' assessment of that entry."

  - id: exp028
    date: "2026-07-31"
    target_id: [greenland]
    type: annexation_threat
    escalation_level: 1
    headline: "Predicts Greenland will be under US control by 2029, offers to 'make that bet'"
    detail: "In a phone interview with Real America's Voice host Steve Gruber, who recalled Gruber's own earlier prediction that Greenland would come under 'operational control' of the US before Trump left office, Trump said the outcome was assured. No acquisition mechanism, timeline, or new concrete step was specified beyond the restated prediction."
    quote: "Make that bet."
    quoted_by: "Donald Trump, Real America's Voice interview"
    source: "Newsweek / AOL"
    source_url: "https://www.newsweek.com/trump-greenland-control-2029-make-that-bet-12275042"
    doctrine_note: "A repetition of the standing claim rather than a new escalation; restated at the same rung (rhetorical) it has held since 2019, seven years running."

  - id: exp029
    date: "2026-08-10"
    target_id: [iran]
    type: military_force_threat
    escalation_level: 3
    headline: "Claims '100% control' of Hormuz, demands Iran pay compensation, calls talks 'last chance'"
    detail: "Trump told reporters the US Navy had swept the Strait of Hormuz for mines and held full control of the waterway, while simultaneously adding a new condition to renewed talks: that Iran pay compensation for past attacks. He called the talks Iran's 'last chance' to reach a deal, warning of 'decapitation' if they failed. Shipping traffic through the strait remained subdued despite the control claim."
    quote: "The only one that has control of the Strait of Hormuz right now is the United States Navy."
    quoted_by: "Donald Trump, Oval Office remarks"
    source: "CNN / CNBC / CBC"
    source_url: "https://www.cnn.com/2026/08/10/world/live-news/iran-war-trump"
    doctrine_note: "A declared operational victory (full control, mines cleared) issued alongside a fresh precondition for the underlying deal -- the toll dispute's pattern of announcing completion while still bargaining over the same asset repeats here on compensation."

  - id: exp030
    date: "2026-08-07"
    target_id: [colombia]
    type: self_congratulatory_claim
    escalation_level: 1
    headline: "Claims credit for Colombian transition as Trump-backed winner takes office amid coup accusations"
    detail: "Trump-backed candidate Abelardo de la Espriella was inaugurated August 7, 2026 after suspending the transition process in July and accusing outgoing President Gustavo Petro of attempting a coup; de la Espriella had publicly appealed to the armed forces not to obey any contrary orders from Petro. Petro disputed the June 2026 election result without providing evidence. Trump publicly claimed credit for the outcome."
    quote: "Congratulations to 'El Tigre' Abelardo de la Espriella, the new president of Colombia! It was a tremendous honor to have supported him, and I look forward to working together to forge a strong relationship between Colombia and the United States that will elevate both nations to new heights."
    quoted_by: "Donald Trump (Truth Social)"
    source: "Newsmax / The Hill / NBC News"
    source_url: "https://thehill.com/policy/international/5957615-de-la-espirella-petro-coup-allegations/"
    doctrine_note: "Follows over a year of sanctions and boat-strike pressure on the outgoing government (exp-series entries at escalation level 3); the change of leadership arrives through a disputed domestic election rather than direct US action, with Trump claiming the credit regardless."
  - id: exp031
    date: "2026-08-11"
    target_id: [iran]
    type: military_force_threat
    escalation_level: 3
    headline: "'They get blown away' -- doubles down on 'total control' of Hormuz as Iran declares it still blocked"
    detail: "Trump told reporters at Joint Base Andrews the US had 'total control' of the Strait of Hormuz and that Iran would be destroyed if it tried to act against US shipping. Tracked vessel transits through the strait fell to a one-week low the same day. Iran publicly rejected the control claim and said the strait would not reopen until the US naval blockade was lifted, sanctions dropped, and its assets unfrozen; an Iranian military adviser said Tehran could 'prolong' the war until Trump leaves office. Pakistan's defense minister, mediating, said the two sides were nonetheless 'close to some sort of arrangement.'"
    quote: "We have total control. We own it, and at some point, maybe they'll do something, and then they get blown away."
    quoted_by: "Donald Trump"
    source: "Bloomberg / Fox News / Al Jazeera"
    source_url: "https://www.bloomberg.com/news/articles/2026-08-12/trump-claims-hormuz-control-as-us-iran-harden-their-positions"
    doctrine_note: "The 'total control' declared here is contradicted by both falling transit volumes and Iran's own public denial the same day -- see Contradiction Tracker c067 for the reversal from 'very good discussions' six days earlier."

  - id: exp032
    date: "2026-08-06"
    target_id: [cuba]
    type: economic_coercion
    escalation_level: 2
    headline: "Sanctions Cuban military, CIA stands up new spy task force"
    detail: "Treasury sanctioned five more organizations and eight more individuals tied to importing, producing, and repairing Cuban military equipment. Separately, the CIA revealed a new task force of analysts and covert-influence specialists tasked with identifying and exploiting divisions within Cuba's ruling elite."
    quote: null
    quoted_by: null
    source: "Local 10 News (WPLG Miami)"
