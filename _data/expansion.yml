    type: military_action
    escalation_level: 4
    headline: "US resumes strikes on Iranian equipment along the Strait of Hormuz"
    detail: "Speaking in the Oval Office after the heaviest exchange of fire since July, Trump said US forces had destroyed new Iranian equipment along the strait and were prepared to strike again at will."
    quote: "We took out all of the new equipment that they tried to build along the Strait of Hormuz"
