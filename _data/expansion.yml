  - id: exp033
    date: "2026-08-06"
    target_id: [venezuela]
    type: self_congratulatory_claim
    escalation_level: 1
    headline: "Claims 'hundreds of billions' in Venezuela oil revenue; independent tally finds $13 billion"
    detail: "Trump told Fox News the US and Venezuela were 'making hundreds of billions of dollars' in oil revenue since the January 2026 takeover of Venezuela's oil industry. PolitiFact found the highest credible public figure for combined revenue since then was $13 billion -- roughly a tenth of the claim."
    quote: "We're making hundreds of billions of dollars, and so are they."
    quoted_by: "Donald Trump"
    source: "PolitiFact"
    source_url: "https://politifact.com/factchecks/2026/aug/06/donald-trump/venezuela-oil-industry-us-gains/"
    doctrine_note: "Congressional Democrats have introduced the Venezuela Oil Proceeds Transparency Act citing the gap between the administration's public figures and the funds' custodial accounting."

  - id: exp034
    date: "2026-11-03"
    target_id: [iran]
    type: military_action
    escalation_level: 4
    headline: "Strikes newly completed Iranian anti-aircraft site; calls it a 'minor attack' that 'wasn't war'"
    detail: "Trump confirmed a US strike on an Iranian air-defence installation in the Qeshm Island area near the Strait of Hormuz, saying US forces had watched it being built for two months and hit it on completion. US officials described the strike as defensive, following Iranian fire on an American aircraft. Indirect talks via Qatar continued the same week."
    quote: "They built an anti-aircraft facility. It took them about two months. We watched it get built. As soon as it was completed, we hit it last night."
    quoted_by: "Donald Trump"
    source: "Al Jazeera, citing Trump's remarks to Fox News"
    source_url: "https://www.aljazeera.com/news/2026/11/4/iran-says-us-reply-to-hormuz-plan-unconvincing-trump-confirms-strikes"
  - id: exp035
    date: "2026-11-12"
    target_id: [iran]
    type: military_force_threat
    escalation_level: 3
    headline: "Declares 'We don't need a deal'; says regime surviving his term would be 'a defeat'"
    detail: "Trump posted on Truth Social that a deal with Iran was no longer needed and reassigned Vice President Vance, a lead negotiator, to domestic matters. In a Salem News Channel interview the same day, asked whether the Iranian government remaining in power at the end of his term would be a defeat, he said it would, and said he would use force again without hesitation. A White House official declined to say whether talks had ended."
    quote: "Yes, that would be a defeat… Absolutely."
    quoted_by: "Donald Trump"
    source: "Times of Israel, quoting Trump's interview with Hugh Hewitt; ABC News (Truth Social post)"
    source_url: "https://www.timesofisrael.com/liveblog-november-13-2026/"
    doctrine_note: "See Contradiction Tracker c068 -- the term-one position on Iranian regime change."
  - id: exp036
    date: "2026-11-12"
    target_id: [cuba]
    type: military_force_threat
    escalation_level: 3
    headline: "Says he would consider a military option for Cuba; wants to 'get Cuba done' before leaving office"
    detail: "Asked by Hugh Hewitt on Salem News Channel whether he would consider military intervention in Cuba, Trump said he would, and named Secretary of State Rubio as the official handling Cuba. The State Department's official account posted the remark the same day. Earlier references had framed Cuba's collapse as a by-product of cutting off Venezuelan oil rather than of direct US action."
    quote: "I want to get Cuba done before I leave, yeah. We have a very good, talented guy for Cuba named Marco."
    quoted_by: "Donald Trump"
    source: "US Department of State (X), November 12, 2026; Semana"
    source_url: "https://x.com/StateDept/status/2120985972716478685"
  - id: exp037
    date: "2026-11-09"
    target_id: [venezuela]
    type: self_congratulatory_claim
    escalation_level: 1
    headline: "Says the US is 'totally in charge' of Venezuela; elections 'at some point'"
    detail: "Speaking to reporters at the White House, Trump said the US was in charge of Venezuela and getting along well with the interim government. Asked whether elections would be held before the end of his term, he said they would at some point, without a date. Secretary Rubio had said on November 5 that elections could 'ideally' be held in 2027."
    quote: "We're much in charge. We're totally in charge and getting along well."
    quoted_by: "Donald Trump"
    source: "The Rio Times; El Venezolano (EFE)"
    source_url: "https://www.riotimesonline.com/trump-says-us-in-charge-of-venezuela/"

  - id: exp038
    date: "2026-08-14"
    target_id: [iran]
    type: annexation_threat
    escalation_level: 1
    headline: "Says he will soon declare the Strait of Hormuz 'a territory of the United States'"
    detail: "At a rally in Garden City, New York, Trump said he would soon declare the Strait of Hormuz a US territory after 'defeating Iran' and described the US blockade as determining which ships pass. On August 18 he posted a map captioned 'New US Territory.' Iran said the strait would remain Iranian."
