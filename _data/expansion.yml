    target_id: [iran]
    type: military_force_threat
    escalation_level: 3
    headline: "At the UN, frames Iran policy as a choice between a deal and annihilation"
    detail: "In his UN General Assembly address Trump said he had 'a big decision to make' on Iran. He added that he believed a deal would be made right after the midterm elections. Outlets differ on his exact wording of the alternative."
