# The Expansion — Territorial & Regime-Change Register
# Documents countries and territories the administration has publicly
# threatened to annex, absorb, or subject to regime change, and tracks each
# through an escalation ladder: rhetorical claim -> economic pressure ->
# military threat -> military action -> regime change achieved.
# Press independently coined "Don-roe Doctrine" for this exact pattern
# (New York Post, later CBS News) after the Venezuela operation -- a
# near-identical pun to this site's own name.
# Last updated: 2026-07-10

snapshot_note: >-
  Escalation level reflects the highest rung reached to date, not
  necessarily the current state -- some targets have cooled (Canada),
  some are frozen mid-threat (Greenland), and some have reached the top
  of the ladder (Venezuela). Level definitions: 1 rhetorical claim, 2
  economic pressure (tariffs/sanctions/financial leverage), 3 military
  threat, 4 military action, 5 regime change achieved.

targets:

  - id: greenland
    name: Greenland
    code: GL
    region: Arctic
    claim_type: [territorial_annexation]
    escalation_level: 3
    escalation_label: "Military threat"
    rationale_claimed: "National security — Arctic shipping lanes and Russian/Chinese activity nearby"
    current_status: "Unresolved. Special envoy appointed; White House confirms 'range of options including military force' under discussion as of Jan 2026. Rhetoric revived at the July 2026 NATO summit with no new concrete step. On July 31, 2026 Trump told Real America's Voice he would 'make that bet' that Greenland is under US control before his term ends in 2029, again with no mechanism specified. Denmark and Greenland both refuse. On September 22, 2026 the US, Denmark and Greenland signed a defence agreement at the UN General Assembly (see deals.yml us-denmark-greenland-defence-2026); Denmark states it recognises Danish sovereignty, while Trump described it as giving the US 'permanent' control for security needs. On October 14 Trump referred to 'our new and beautiful Greenland' in a post on oil and mineral exploration. No transfer of sovereignty has occurred."
    target_response: "Greenland's PM called annexation talk 'fantasies.' Denmark and European allies issued a joint statement defending 'sovereignty, territorial integrity and inviolability of borders.' Denmark has since expanded military conscription, citing a worsening Arctic security environment."
    first_asserted_date: "2019-08-15"
    last_updated_date: "2026-10-14"

  - id: canada
    name: Canada
    code: CA
    region: North America
    claim_type: [territorial_annexation, economic_coercion]
    escalation_level: 2
    escalation_label: "Economic pressure"
    rationale_claimed: "Trade imbalance; repeated framing of Canada as a natural '51st state'"
    current_status: "Rhetoric on absorption has cooled since late 2025, but economic pressure escalated sharply on July 20, 2026 with new 50% tariffs on roughly $20 billion of Canadian autos, alcohol, dairy, and other goods (see deals.yml us-canada-tariffs-2026), taking effect August 19, 2026. No military threat made. Canadian negotiators pushed for a deal ahead of the deadline through early August; Trade Minister LeBlanc made a third trip to Washington in as many weeks on August 11, with reports of a draft deal on the table covering autos, alcohol, dairy, critical minerals, and security, though CBC reported Canada was unsatisfied with the latest US offer as of August 12. Talks broke down; after a three-day suspension the 50% duties took effect on August 22, and Canada imposed dollar-for-dollar counter-tariffs on September 8. Talks resumed after an October 31 Trump-Carney call; by November 8 Trump said the two leaders had 'the concept' of a deal, with nothing signed and the 50% duty still in force."
    target_response: "PM Mark Carney has been unambiguous that Canada has no interest in joining the US. Ontario pulled an anti-tariff ad after Trump threatened to end trade talks over it. On the July 2026 tariffs, Carney said Canada believes in 'the benefits of free and fair trade' and remains open to negotiation, warning of an 'ugly new phase' if the August 19 tariffs take hold."
    first_asserted_date: "2024-11-15"
    last_updated_date: "2026-11-08"

  - id: panama
    name: Panama (Canal)
    code: PA
    region: Central America
    claim_type: [territorial_annexation, economic_coercion]
    escalation_level: 2
    escalation_label: "Economic pressure"
    rationale_claimed: "Historic US construction and defense of the canal; claims of Chinese influence over canal operations"
    current_status: "Claims the canal was 'reclaimed' via a BlackRock-led consortium's purchase of a controlling stake in the company operating nearby ports. Panama's government disputes this is equivalent to control of the canal itself. Grievance revived rhetorically at the July 2026 Roosevelt library dedication with no new concrete action."
    target_response: "Panama's president publicly accused Trump of 'lying' about reclaiming the canal."
    first_asserted_date: "2024-12-21"
    last_updated_date: "2026-07-01"

  - id: gaza
    name: Gaza
    code: PS
    region: Middle East
    claim_type: [territorial_annexation]
    escalation_level: 1
    escalation_label: "Rhetorical claim"
    rationale_claimed: "Redevelopment — described as turning a 'territory of death and destruction' into a US-run 'freedom zone'"
    current_status: "Proposal reiterated multiple times, no concrete US territorial action taken. Distinct from the broader Israel-Hamas ceasefire/hostage process, which is tracked separately."
    target_response: "Widely rejected by Arab states and Palestinian officials as a displacement plan."
    first_asserted_date: "2025-02-04"
    last_updated_date: "2025-05-15"

  - id: venezuela
    name: Venezuela
    code: VE
    region: South America
    claim_type: [regime_change, military_intervention]
    escalation_level: 5
    escalation_label: "Regime change achieved"
    rationale_claimed: "Counter-narcotics — Maduro government designated a drug-trafficking enterprise"
    current_status: "January 2026: US military operation captured Maduro in Caracas; he now faces drug trafficking charges in the US. Interim government installed under Delcy Rodriguez, recognized by the US (see strongmen/contradictions c066). This is the case that prompted the press to coin 'Don-roe Doctrine.' Seven months on, Trump has touted oil-revenue gains from the US-run custodial arrangement -- on August 4 claiming 'hundreds of billions of dollars,' a figure PolitiFact found overstated roughly tenfold against the highest credible public accounting ($13 billion). The administration announced a long-term oil concession on August 28 (see deals.yml venezuela-oil-concession-2026), with Trump claiming majority US control of 65 billion barrels of reserves; he said on September 2 that Venezuela was 'not ready' for elections, met Rodriguez at the UN on September 22, and said on September 26 that he had spoken to her about elections. Opposition leader Machado returned to Caracas on October 25. No election date has been set."
    target_response: "Cuban government reported 32 Cuban nationals (Maduro's bodyguard/intelligence detail) killed in the operation. Colombia's Petro warned against similar action in his own country. Congressional Democrats introduced the Venezuela Oil Proceeds Transparency Act over the custodial oil-fund accounting."
    first_asserted_date: "2025-08-01"
    last_updated_date: "2026-11-09"

  - id: cuba
    name: Cuba
    code: CU
    region: Caribbean
    claim_type: [economic_coercion, military_intervention, regime_change]
    escalation_level: 3
    escalation_label: "Military threat"
    rationale_claimed: "Regime collapse framed as a byproduct of cutting off Cuba's Venezuelan oil lifeline, not direct US action"
    current_status: "No direct military threat made. Trump has publicly predicted the government will 'fall' on its own once Venezuelan oil support ends, repeating in July 2026 that Cuba is 'coming our way.' Rubio: Cuban leaders 'in a lot of trouble.' On August 6, Treasury added new sanctions on Cuba's military and the CIA disclosed a dedicated task force targeting divisions within the ruling elite -- pressure escalating in kind, not in rung. On November 12, 2026, asked by Hugh Hewitt on Salem News Channel whether he would consider a military option for Cuba, Trump said he would, adding that he wanted to 'get Cuba done' before leaving office -- the first explicit military-option statement on Cuba, moving the register from economic pressure to military threat. At the UN General Assembly on September 22 Trump called Cuba 'an absolutely failed state' that 'will fall'; on October 23 he told a rally the US would deal with Cuba after returning from Iran, and on October 30 said the matter would be resolved within the remaining two and a half years of his term, against a July 15 forecast of 'perhaps two months.'"
    target_response: "President Diaz-Canel said Cuba would resist any US military intervention 'to the very last drop of blood.' Cuba's foreign minister brought a formal complaint over the US pressure campaign before the UN General Assembly on July 7, 2026. An assembly of leftist organizations from 25 countries convened in Havana on August 6 in solidarity with the government."
    first_asserted_date: "2026-01-11"
    last_updated_date: "2026-11-12"

  - id: colombia
    name: Colombia
    code: CO
    region: South America
    claim_type: [economic_coercion, military_intervention]
    escalation_level: 3
    escalation_label: "Military threat"
    rationale_claimed: "Counter-narcotics — accused President Petro of allowing cocaine production to flourish"
    current_status: "Sanctions imposed on Petro (Oct 2025); over 115 people killed in US strikes on alleged drug boats. When asked directly if military action against Colombia was being threatened, Trump said 'it sounds good to me.' In a July 2026 call focused on coca eradication, Petro personally asked Trump to lift his own sanctions listing; Trump said he would 'do his best.' Petro's term ended amid a disputed June 2026 election; Trump-backed winner Abelardo de la Espriella suspended the transition and accused Petro of attempting a coup, taking office August 7, 2026 with Trump's public backing. Petro left office on August 7, succeeded by Trump-backed Abelardo de la Espriella. On August 13 Defense Secretary Hegseth said Colombia had authorized joint US-Colombian military operations against traffickers, and the State Department said it intends to announce $1 billion in assistance; the threat posture shifted from coercion of Petro to cooperation with his successor."
    target_response: "Petro accused the US of violating international law with the boat strikes and said he 'would take up arms' for his country if necessary, despite having sworn off violence. Petro disputed the June 2026 election result without providing evidence and did not fully recognize de la Espriella's legitimacy."
    first_asserted_date: "2025-10-01"
    last_updated_date: "2026-08-13"

  - id: iran
    name: Iran
    code: IR
    region: Middle East
    claim_type: [military_intervention, regime_change]
    escalation_level: 4
    escalation_label: "Military action"
    rationale_claimed: "Nuclear non-proliferation — prevention of an Iranian nuclear weapon"
    current_status: "US airstrikes hit Fordo, Natanz, and Isfahan nuclear facilities (June 2025) during a broader Israel-Iran war. A 2026 wave of Iranian protests drew a further Trump threat to 'come to the rescue.' A June 2026 ceasefire broke down in early July after tanker attacks in the Strait of Hormuz; Trump declared the truce 'over' and US forces struck roughly 90 Iranian targets over two days, though talks continued. On July 13 Trump reinstated the naval blockade of Iran and announced a 20% Hormuz transit toll billed as a 'guardian' fee; he dropped the toll a day later citing pending Gulf state investment pledges, while the blockade remained in effect. Iranian ballistic missile and drone attacks killed three US service members in Jordan and one in Iraq on July 17-19; Trump vowed retaliation and, on July 22, threatened to destroy an Iranian bridge or power plant for every future attack on Hormuz shipping. The administration formally notified Congress that a new 60-day war-powers window had begun, a position congressional Democrats dispute (see deals.yml us-iran-mou-2026). Treasury imposed an eighth 2026 sanctions round on Iran's alleged shadow-banking network in early August. On August 10-11, Trump claimed the US Navy had swept the Strait of Hormuz for mines and held '100%' control of it, called renewed talks Iran's 'last chance' before 'decapitation,' and added a new demand that Iran pay compensation for past actions as a condition of any deal. He repeated the control claim on August 11-12 ('they get blown away'), even as tracked vessel transits fell to a one-week low. In early November the war continued at lower intensity under the blockade: on November 3 Trump confirmed a strike on a newly completed Iranian anti-aircraft facility, calling it a 'minor attack' that 'wasn't war'; on November 7 the US military stood up Task Force Iron Gate to interdict Iranian land and Caspian Sea transport routes; on November 8-9 Trump called renewed large-scale attacks 'highly unlikely' while talks progressed via Qatar. On November 12 he posted 'We don't need a deal with Iran,' reassigned Vice President Vance away from the negotiations, and told Hugh Hewitt that the regime remaining in power at the end of his term would be 'a defeat' and that he would use force again with 'no hesitation.' Between mid-August and early November the pattern was rhetoric and economic escalation punctuated by strikes. On August 14 Trump said he would soon declare the Strait of Hormuz a territory of the United States; on August 17 the 60-day MOU window lapsed without a deal; on August 19 he announced an 'economic warfare' campaign of secondary sanctions; and on September 2 the US struck new Iranian equipment along the strait after the heaviest exchange of fire since July. At the UN General Assembly on September 22 he posed the choice between a deal and annihilation of the Islamic Republic, and on October 8 pledged no attack before the November 3 midterms; on October 13 he said 'we're going to do a number' on Iran."
    target_response: "Iran denied it was close to a weapon; DNI Gabbard's own intelligence assessment publicly contradicted Trump's stated justification for the strikes (see Contradiction Tracker). Iran maintains it holds sovereignty over Strait of Hormuz shipping routes and rejected any US role administering it; Iranian FM Araghchi sarcastically endorsed the toll principle while calling 20% 'too much.' Iran's supreme leader called Trump's signature on the June MOU 'worthless' after the ceasefire collapsed. Araghchi said Iran's defense doctrine is 'eye for an eye' and that any strike on its infrastructure 'will compel a powerful and decisive response.' On August 12, Iran publicly rejected the 'total control' claim outright and said the strait stays closed until the blockade, sanctions, and asset freezes end; an Iranian military adviser said the war could be 'prolonged' past Trump's term."
    first_asserted_date: "2025-02-28"
    last_updated_date: "2026-11-12"

