  - id: exp023
    date: "2026-07-13"
    target_id: [iran]
    type: military_action
    escalation_level: 4
    headline: "Reinstates naval blockade of Iran, declares US 'guardian' of Hormuz with 20% toll"
    detail: "After a week of renewed US-Iran strikes that unraveled the June ceasefire MOU, Trump announced on Truth Social and in a Fox News interview that the US would reinstate what he called 'THE IRANIAN BLOCKADE' of the Strait of Hormuz beginning at 20:00 GMT the following day — reversing the MOU provision that had reopened the strait. He simultaneously declared the US would become 'GUARDIAN OF THE HORMUZ STRAIT' and charge a 20% reimbursement toll on all cargo shipped through it. Secretary of State Rubio and Vice President Vance had rejected the legality of such tolls the prior month; the UN's International Maritime Organization said the plan had no legal basis. Iran's joint military command warned any US interference in strait management would be treated as an act of war."
    quote: "We are reinstating THE IRANIAN BLOCKADE, so named because it is only stopping Iran's ships or customers from entering or leaving... The U.S.A. will be, from this point forward, known as 'THE GUARDIAN OF THE HORMUZ STRAIT,' but as such, and as a matter of FAIRNESS, will be reimbursed, at the rate of 20% on all cargo shipped, for any and all costs necessary to do the job of providing safety and security to this very volatile section of the World."
    quoted_by: "Donald Trump"
