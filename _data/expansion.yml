  - id: exp039
    date: "2026-08-19"
    target_id: [iran]
    type: economic_coercion
    escalation_level: 2
    headline: "Announces 'Economic Warfare' on Iran after the 60-day MOU window lapses"
    detail: "Two days after the 60-day window in the June memorandum expired without a deal, Trump announced an economic campaign against Iran and warned third countries doing business with it. Treasury followed with secondary-sanctions measures in the following week; China's foreign ministry said they would fuel tensions."
