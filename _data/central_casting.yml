    source_type: public
    motif: []
    reaction:
    notes: >-
      The appearance compliment is immediately followed by an explicit pivot
      to competence ("that's all I care about"), distinct from the
      disclaimer_bit pattern tracked elsewhere in this register, in which
      the qualifier precedes rather than follows the compliment.

