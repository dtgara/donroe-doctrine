# Central Casting Register
# Documents presidential commentary on the physical appearance of foreign heads
# of state, heads of government, and other senior foreign officials (military,
# royal, diplomatic) who are not themselves the nominal head of state.
# Unlike the Strongmen Files (governance-style praise) or Epithets (country
# characterisation), this register tracks commentary on individual appearance
# specifically — compliments, insults, and the ambiguous space between them.
# Status: incomplete — register grows as transcripts and pool reports are catalogued.
# Last updated: 2026-07-03

entries:
  - id: cc001
    date: "2017-11-11"
    term: 1
    subject: Kim Jong-un
    country: North Korea
    role: head_of_state
    gender: m
    valence: derogatory
    focus: body_specific
    quote: >-
      Why would Kim Jong Un insult me by calling me "old," when I would NEVER
      call him "short and fat?"
    context: Twitter/X, responding to Kim Jong-un calling Trump "old" in a state media statement
    source: "Twitter/X, November 11, 2017 (widely reported contemporaneously)"
    source_url:
    source_type: public
    motif: [insult_by_denial]
    reaction:
    notes: >-
      Denies making an insult while making it in the same sentence — the
      insult-by-denial move recurs in later material and is worth tracking
      as its own motif rather than a one-off.

  - id: cc002
    date: "2018-06-12"
    term: 1
    subject: Kim Jong-un
    country: North Korea
    role: head_of_state
    gender: m
    valence: complimentary
    focus: comparison_to_self
    quote: "Getting a good picture, everybody? So we look nice and handsome and thin and perfect?"
    context: Singapore summit, joint photo session with press pool
    source: "The Hill, June 12, 2018"
    source_url: "https://thehill.com/homenews/administration/391760-trump-asks-photographers-at-summit-to-make-sure-pictures-show-them/"
    source_type: public
    motif: [photo_op_vanity]
    reaction: "Kim reportedly remained expressionless on hearing the translation; described by those present as 'not amused.'"
    notes: >-
      Framed as a joint compliment but centred on how Trump himself would
      appear in the photo — filed under comparison_to_self rather than a
      pure compliment to Kim.

