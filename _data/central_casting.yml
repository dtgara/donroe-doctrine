    notes: >-
      The Élysée Palace said the glasses were worn to protect an eye injured
      by a burst blood vessel; the remark reads as sarcastic rather than a
      genuine compliment, hence ambiguous rather than complimentary.

  - id: cc013
    date: "2026-04-02"
    term: 2
    subject: Emmanuel Macron
    country: France
    role: head_of_state
    gender: m
    valence: derogatory
    focus:
    borderline: true
    quote: "I call up France, Macron — whose wife treats him extremely badly. Still recovering from the right to the jaw."
    context: Public remarks referencing a viral video clip appearing to show Brigitte Macron shoving the French president
    source: "France 24, April 2, 2026"
    source_url: "https://www.france24.com/en/france/20260402-trump-dig-macron-wife-brigitte-treats-badly-sparks-anger-france"
    source_type: public
    motif: [borderline_non_appearance]
    reaction: "Macron called the comments 'neither elegant nor up to standard.'"
    notes: >-
      Marked borderline: the jab targets Macron's marriage and masculinity
      rather than his appearance directly. Included on grounds of
      documentary completeness, consistent with how epithets.yml handles
