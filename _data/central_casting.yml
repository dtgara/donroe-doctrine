    quote: "I watched Emmanuel Macron yesterday with those beautiful sunglasses."
    context: Davos address, referencing the aviator sunglasses Macron wore during his own remarks
    source: "Euronews, January 21, 2026"
    source_url: "https://www.euronews.com/2026/01/21/trump-mocks-macrons-aviators-in-davos-address-amid-growing-war-of-words"
    source_type: public
    motif: []
