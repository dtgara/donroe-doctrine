  - id: cc007
    date: "2025-06-18"
    term: 2
    subject: Asim Munir
    country: Pakistan
    role: military
    gender: m
    valence:
    focus:
    quote: "An exceptional man, a great fighter, my favorite field marshal."
    context: Remarks following a White House lunch with Pakistan's army chief, after the India-Pakistan ceasefire
    source: "Al Jazeera, December 31, 2025 (compiling remarks from mid-2025)"
    source_url: "https://www.aljazeera.com/news/2025/12/31/how-pakistans-asim-munir-became-trumps-favourite-field-marshal"
    source_type: public
    motif: [praised_but_not_on_looks]
    reaction:
    notes: >-
      Deliberate contrast row. Munir — Pakistan's military chief, not its
      head of state or head of government — has received some of the most
      extravagant praise of the term, consistently framed around competence
      and toughness, never appearance. Included with valence/focus left
      blank to make that absence visible rather than force-fitting it into
      the compliment axis.

