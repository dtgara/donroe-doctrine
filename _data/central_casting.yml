    reaction: "Meloni separately disputed a related Trump claim that she had 'begged' for a photo with him."
    notes: >-
      The self-aware disclaimer ("I'm not allowed to say it") recurs in
      close-to-verbatim form across multiple women leaders and is tracked
      here as its own motif rather than treated as incidental framing.

