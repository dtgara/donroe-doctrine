  - id: cc014
    date: "2026-05-15"
    term: 2
    subject: Xi Jinping
    country: China
    role: head_of_state
    gender: m
    valence: complimentary
    focus: body_specific
    quote: >-
      If you went to Hollywood and looked for a leader of China to play a
      role in a movie... he's Central Casting. He's tall, very tall.
      Especially for this country, cause they tend to be a little bit shorter.
    context: Interview with Sean Hannity, Beijing, following a US-China summit
    source: "HuffPost, May 15, 2026"
    source_url: "https://www.huffpost.com/entry/donald-trump-xi-jinping-sean-hannity-interview-central-casting_n_6a0684e1e4b0a33000e10244"
    source_type: public
    motif: [central_casting_literal, national_stereotype]
    reaction:
    notes: >-
      The literal "Central Casting" phrase that gives this register its
      name. The second half of the quote generalises about height across
      an entire nationality and is flagged separately via the
      national_stereotype motif tag.

  - id: cc015
    date: "2026-06-17"
    term: 2
    subject: Narendra Modi
    country: India
    role: head_of_government
    gender: m
    valence: complimentary
    focus: face_general
    quote: "The most beautiful-looking man... he looks so nice, like an angel. But he's as tough as he is a killer."
    context: Remarks following a G7 summit meeting
    source: "India TV News, June 17, 2026"
    source_url: "https://www.indiatvnews.com/news/world/trump-calls-pm-modi-most-beautiful-looking-man-says-he-appears-like-an-angel-but-he-is-as-tough-as-he-is-a-killer-2026-06-17-1045225"
    source_type: public
    motif: [angel_killer_pairing]
    reaction:
    notes: >-
      Modi is head of government; India's head of state is President
      Droupadi Murmu. The compliment-then-violent-qualifier structure
      ("angel... but a killer") recurs closely enough across entries to
      warrant its own motif tag.

  - id: cc016
