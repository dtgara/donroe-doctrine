  - id: cc010
    date: "2025-10-13"
    term: 2
    subject: Giorgia Meloni
    country: Italy
    role: head_of_government
    gender: f
    valence: complimentary
    focus: face_general
    quote: >-
      We have a woman — a young woman who is... I'm not allowed to say it
      because usually it's the end of your political career if you say it.
      She's a beautiful young woman.
    context: Remarks at the Gaza peace summit, Sharm el-Sheikh, Egypt
    source: "The Daily Beast, October 2025"
    source_url: "https://www.thedailybeast.com/trump-79-awkwardly-tells-world-leader-giorgia-meloni-shes-beautiful/"
    source_type: public
