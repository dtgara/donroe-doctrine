- id: congo-rwanda-ended
  statement: I've made peace between Rwanda and the Congo. A peace deal has been signed. This conflict is over.
  date_made: '2025-09-22'
  source: UN General Assembly address, September 22, 2025
  countries:
  - Congo
  - Rwanda
  category: war_peace
  term: 2
  status: wrong
  outcome_date: '2025-07-01'
  outcome_note: A peace framework was mediated by the US in Washington in June 2025. Within weeks, Rwanda-backed M23 militia
    resumed attacks on Congolese forces and expanded territorial control. M23 killed over 140 civilians in eastern Congo in
    July 2025. Secretary of State Rubio acknowledged this as a clear violation of the ceasefire. Foreign policy experts described
    Trump's declaration of success as premature. A subsequent US-mediated peace and minerals agreement was signed between
    DRC and Rwanda at the White House on June 27, 2026; M23 was not party to the talks. Fighting resumed within hours of signing.
- id: armenia-azerbaijan-ended
  statement: Armenia and Azerbaijan have made peace. I brought them together. A deal has been signed at the White House.
  date_made: '2025-08-08'
  source: Remarks at White House trilateral agreement ceremony, August 8, 2025
  countries:
  - Armenia
  - Azerbaijan
  category: war_peace
  term: 2
  status: correct
  outcome_date: '2025-08-08'
  outcome_note: On August 8, 2025, Armenian Prime Minister Pashinyan and Azerbaijani President Aliyev initialed an agreement
    and signed a joint declaration at the White House, with Trump credited as mediator. A 99-year US development concession
    along the connecting corridor — named the Trump Route for International Peace and Prosperity (TRIPP) — was included. The
    agreement has not been ratified by either parliament. Armenian constitutional amendments required for full implementation
    are slated for referendum no earlier than 2027.
- id: india-pakistan-ended
  statement: I ended the war between India and Pakistan. They were going to use nuclear weapons. I stopped it.
  date_made: '2025-09-22'
  source: UN General Assembly address, September 22, 2025; similar claims in multiple interviews
  countries:
  - India
  - Pakistan
  category: war_peace
  term: 2
  status: wrong
  outcome_date: '2025-05-15'
  outcome_note: A ceasefire was agreed after weeks of cross-border missile and drone strikes following a Kashmir massacre.
    Pakistan credited US involvement. India explicitly denied it, stating the ceasefire was agreed directly between the two
    countries without US brokering. The underlying Kashmir dispute — contested for 75 years — remains entirely unresolved.
    Foreign policy experts noted Trump's tariff pressure on India complicated any future US role.
- id: egypt-ethiopia-ended
  statement: I brought peace to Egypt and Ethiopia. There is peace, at least for now, because of my intervention.
  date_made: '2025-06-01'
  source: Truth Social post, June 2025; cited in UN General Assembly address September 2025
  countries:
  - Egypt
  - Ethiopia
  category: war_peace
  term: 2
  status: wrong
  outcome_date: '2025-09-01'
  outcome_note: Egypt and Ethiopia were not at war. Their dispute over Ethiopia's Grand Ethiopian Renaissance Dam on the Nile
    has been a diplomatic standoff, not an armed conflict. No deal was announced. Ethiopia proceeded with the dam's official
    opening. Egypt's longstanding objections that the dam restricts Nile water flow remained unaddressed. Foreign policy experts
    stated plainly that there was no war here to end.
- id: serbia-kosovo-ended
  statement: I ended the conflict between Serbia and Kosovo. I did that in my first term, and we've kept the peace.
  date_made: '2025-09-22'
  source: UN General Assembly address, September 22, 2025
  countries:
  - Kosovo
  category: war_peace
  term: 2
  status: wrong
  outcome_date: '2026-06-01'
  outcome_note: Serbia and Kosovo were not at war in 2025. A US-brokered economic normalisation deal was signed in Trump's
    first term in 2020 but stalled almost immediately. Kosovo declared independence in 2008, which Serbia still does not recognise.
    European-led talks have continued without breakthrough. Experts noted Trump's Term 1 deal produced no lasting change;
    any peace maintenance in the region is the product of EU and NATO presence, not US diplomacy.
- id: thailand-cambodia-ended
  statement: 'Thailand and Cambodia were going to war. I told them: stop, or face tariffs. And it worked.'
  date_made: '2025-09-22'
  source: UN General Assembly address, September 22, 2025
  countries: []
  category: war_peace
  term: 2
  status: wrong
  outcome_date: '2025-12-12'
  outcome_note: A ceasefire was reached July 28, 2025, and a broader Kuala Lumpur Peace Accord was signed October 26, 2025,
    with Trump presiding. Trump cited tariff threats as decisive. The accord broke down in November 2025 after Thai soldiers
    were injured by a landmine. On December 8, Thailand conducted air strikes on Cambodian military sites. On December 12,
    Trump announced via Truth Social that he had again spoken with both leaders and secured a halt to hostilities — suggesting
    the initial claim that "it worked" required at least two further interventions.
