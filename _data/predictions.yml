# ── IRAN ─────────────────────────────────────────────────────────────────────

- id: iran-30-days
  statement: "Iran will call us within 30 days of me taking office."
  date_made: '2018-07-22'
  source: Fox News interview following JCPOA withdrawal, July 2018
  countries: [Iran]
  category: nuclear
  term: 1
  status: wrong
  outcome_date: '2021-01-20'
  outcome_note: Iran did not call within 30 days. Iran did not call within 1,000
    days. Under sustained maximum pressure sanctions, Iran accelerated uranium enrichment
    and reduced IAEA cooperation. No new deal was reached in Term 1. Iran's nuclear
    programme advanced significantly during the period of maximum pressure.

- id: iran-maximum-pressure-capitulation
  statement: "Iran will come to the table, they have no choice. Maximum pressure
    will bring them to their knees."
  date_made: '2019-05-05'
  source: Remarks following Iran maximum pressure announcement, May 2019
  countries: [Iran]
  category: nuclear
  term: 1
  status: wrong
  outcome_date: '2021-01-01'
  outcome_note: Iran did not capitulate. Instead, Iran progressively rolled back
    JCPOA commitments, enriching uranium to 60% purity by 2021 — a level with no
    civilian justification. Iran's breakout time to a nuclear weapon shortened
    substantially during the maximum pressure period.

- id: iran-deal-term2
  statement: "Iran is going to make a deal with us. They have no money, they have
    no anything. They'll be calling us."
  date_made: '2025-02-04'
  source: White House press remarks, February 4, 2025
  countries: [Iran]
  category: nuclear
  term: 2
  status: pending
  outcome_date: null
  outcome_note: Nuclear negotiations begun in spring 2025. After US-Israeli strikes
    on Iranian facilities in February 2026, ceasefire-adjacent talks underway
    as of mid-2026. A deal has not been finalized. Trump has described any deal
    he reaches as historic; critics note it would resemble the JCPOA he called
    the worst deal ever made.

# ── CHINA / TRADE ─────────────────────────────────────────────────────────────

- id: trade-wars-easy
  statement: "Trade wars are good, and easy to win."
  date_made: '2018-03-02'
  source: Twitter/X, March 2, 2018
  countries: [China]
  category: trade
  term: 1
  status: wrong
  outcome_date: '2020-01-15'
  outcome_note: The US-China trade war cost American consumers and farmers an estimated
    $316 billion by 2020 (Federal Reserve research). The Phase 1 deal signed January
    2020 required China to purchase $200 billion in additional US goods — a target
    China missed by roughly 40%. US manufacturers did not broadly return from China.

- id: china-pays-tariffs
  statement: "China is paying us billions and billions of dollars in tariffs."
  date_made: '2019-05-10'
  source: Rally remarks, May 2019
  countries: [China]
  category: trade
  term: 1
  status: wrong
  outcome_date: '2020-01-01'
  outcome_note: Tariffs are paid by importing companies, not by China. Multiple
    Federal Reserve and academic studies confirmed that US businesses and consumers
    bore the cost of the tariffs. The Peterson Institute estimated American importers
    paid nearly all of the tariff costs passed through to US prices.

- id: china-phase1-purchases
  statement: "China has agreed to purchase $200 billion in additional goods.
    This is the greatest deal ever made."
  date_made: '2020-01-15'
  source: Phase 1 trade deal signing ceremony, January 15, 2020
  countries: [China]
  category: trade
  term: 1
  status: wrong
  outcome_date: '2021-01-20'
  outcome_note: China purchased approximately $59 billion of the $200 billion target
    in 2020 — roughly 58% short of the commitment, partly due to COVID-19 disruptions
    but also structural unwillingness. The trade deficit with China widened during
    the period of the deal.

