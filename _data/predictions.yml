# ── NATO / ALLIANCES ─────────────────────────────────────────────────────────

- id: nato-allies-will-pay
  statement: "I told NATO: you have to pay up. And they did."
  date_made: '2024-02-10'
  source: Rally remarks, South Carolina, February 10, 2024
  countries: [NATO]
  category: alliance
  term: 2
  status: correct
  outcome_date: '2025-12-01'
  outcome_note: NATO member defence spending did increase substantially under sustained
    US pressure across both Trump terms and the Biden years. By 2025, a majority
    of NATO allies met or exceeded the 2% GDP target — up from under one-third in
    2016. NATO Secretary General Rutte called for spending "considerably more than
    3%." Causal link disputed; European threat perception post-Ukraine also drove increases.

- id: nato-nondefense-deadbeats
  statement: "If they don't pay, I will not defend them. I would encourage Russia
    to do whatever the hell they want."
  date_made: '2024-02-10'
  source: Rally remarks, South Carolina, February 10, 2024
  countries: [NATO, Russia]
  category: alliance
  term: 2
  status: abandoned
  outcome_date: '2025-06-01'
  outcome_note: Despite the threat, the US remained formally committed to NATO Article 5
    through 2025. Trump privately pressured allies on spending but did not follow
    through on the explicit non-defence threat. The statement itself caused significant
    diplomatic damage with European allies.

