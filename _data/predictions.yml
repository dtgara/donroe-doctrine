  source: Truth Social post following Liberation Day tariff announcement, April 2025
  countries:
  - China
  category: trade
  term: 2
  status: pending
  outcome_date: null
  outcome_note: A US-China truce was reached at the Busan summit in October 2025. Section 232 tariffs on steel and aluminium
    were reduced from 25% to 15% for countries that signed trade frameworks, including the UK, EU, Switzerland, Taiwan, Japan,
    and South Korea. A further US-China tariff agreement on June 11, 2026 reduced Chinese import rates from approximately
    41% to 31%, with higher tariffs paused for 60 days. Tariffs have come down for deal-makers; structural global tariffs
    remain elevated. Final comprehensive deals remain unsigned as of June 2026.
