    capability. Bilateral safeguards agreement short of the "gold standard" barring enrichment. Congressional review
    period pending. Trump's July 23 social media post adds an unwritten condition tying the deal to Saudi normalization
    with Israel. Press Secretary Karoline Leavitt confirmed days later that the condition was firm rather than a slip:
    "he has said if they don't join the Abraham Accords, the deal is off." Saudi Arabia has not moved off its own
    precondition of a path to Palestinian statehood.
