- id: greenland-i
  title: "The Greenland Acquisition (First Offer)"
  strapline: "An opening bid on an autonomous Danish territory. Denmark described the proposal as absurd. The proposal was not withdrawn."
  date: 2019-08-18
  term: 1
  type: Territorial
  terms_and_conditions: >
    The United States of America hereby expresses interest in purchasing Greenland
    from the Kingdom of Denmark. Price to be determined. Strategic value: considerable.
    Ice: abundant. Danish consent: pending. The word absurd is noted and disregarded.
  doctrine_rating: 8
  status: UNRESOLVED
  outcome: "Denmark declined. The Prime Minister called the idea absurd. The US cancelled a scheduled state visit in response. Greenland remains Danish. For now."

- id: greenland-ii
  title: "The Greenland Acquisition (Renewed Mandate)"
  strapline: "A second offer on the same territory. Military options not ruled out. Denmark's position unchanged. Ours neither."
  date: 2025-01-07
  term: 2
  type: Territorial
  terms_and_conditions: >
    The United States reaffirms its interest in Greenland. The previous offer stands,
    adjusted for inflation and urgency. Control of Greenland is described as an absolute
    necessity for national security. The method of acquisition remains open. All options
    are on the table. The table is large.
  doctrine_rating: 9
  status: ACTIVE
  outcome: "Denmark and Greenland have again declined. The US has not accepted the decline. Greenland's Prime Minister called for self-determination. The US considers this a promising development."

- id: canada-51st-state
  title: "The Canadian Annexation"
  strapline: "Canada offered the opportunity to become the 51st State. The Prime Minister referred to as Governor. Economic pressure applied via 25% tariffs. Canada has not yet accepted."
  date: 2025-01-09
  term: 2
  type: Territorial
  terms_and_conditions: >
    The United States proposes that Canada voluntarily dissolve its national sovereignty
    and accede to the union as the fifty-first state. Benefits include access to the
    US market, which Canada already has. Risks include the elimination of Canada as
    a concept. The transition would be accomplished through economic means. The word
    invasion has not been used by us. Others have used it. We note this without comment.
  doctrine_rating: 7
  status: ACTIVE
  outcome: "Canada has not accepted. The Liberal Party lost the election. The Conservative government has also not accepted. Tariffs remain. The Governor title has not been formally adopted."

- id: panama-canal-reclamation
  title: "The Panama Canal Reclamation"
  strapline: "The United States demands the return of the Panama Canal. Panama has declined. The canal was described as being run by China. It is not run by China."
  date: 2025-01-21
  term: 2
  type: Territorial
  terms_and_conditions: >
    The United States hereby demands the return of the Panama Canal, ceded under
    the Torrijos–Carter Treaties of 1977. The canal is described as vital to national
    security and currently operated by China. Panama operates the canal. A Chinese
    company holds a port concession at either end. These are presented as equivalent.
    Panama is advised to return the canal. The mechanism of return is unspecified.
    All options remain available.
  doctrine_rating: 6
  status: UNRESOLVED
  outcome: "Panama has declined to return the canal. Panama's president stated the canal belongs to Panama and will continue to do so. The US has not yet responded to this response."

- id: steel-aluminium-tariffs
  title: "The Steel and Aluminium Arrangement"
  strapline: "25% tariffs on all steel and aluminium imports. Friends and allies included. No exceptions provided. The arrangement is described as necessary."
  date: 2025-03-12
  term: 2
  type: Trade
  terms_and_conditions: >
    Effective immediately, a tariff of 25 percent is applied to all steel and aluminium
    imports entering the United States of America, without exception and without
    exemption. Prior exemptions granted during Term 1 have been reviewed and rescinded.
    Allies are reminded that the concept of ally is provisional. The European Union,
    Canada, Mexico, Japan, South Korea, and others have registered objections.
    The objections are noted. The tariffs remain.
  doctrine_rating: 7
  status: ACTIVE
  outcome: "Tariffs applied globally. Retaliatory measures announced by EU, Canada, and others. US steel industry expresses support. Downstream manufacturers express concern. The concern has not altered the tariff."

- id: nafta-usmca
  title: "The NAFTA Replacement (USMCA)"
  strapline: "NAFTA described as the worst trade deal ever made. A new deal negotiated with Canada and Mexico. The new deal is largely similar to the old deal. This is described as a victory."
  date: 2018-11-30
  term: 1
  type: Trade
  terms_and_conditions: >
    The North American Free Trade Agreement, in force since 1994, is hereby declared
    the worst trade deal ever made in the history of trade deals, possibly ever.
    A replacement agreement, the United States–Mexico–Canada Agreement, is negotiated.
    The USMCA contains meaningful updates in dairy access, automotive rules of origin,
    and dispute settlement. It also contains many provisions from NAFTA. The distinction
    between the two agreements is described as tremendous.
  doctrine_rating: 7
  status: COMPLETED
  outcome: "USMCA ratified by all three parties in 2020. Entered into force July 1, 2020. Most economists describe it as a modernisation of NAFTA rather than a replacement. The administration describes this characterisation as unfair."

- id: jcpoa-withdrawal
  title: "The Iran Nuclear Deal Exit"
  strapline: "The JCPOA described as the worst deal ever negotiated. The US withdraws. Maximum pressure applied. Iran resumes enrichment. The situation is described as under control."
  date: 2018-05-08
  term: 1
  type: Alliance
  terms_and_conditions: >
    The United States withdraws from the Joint Comprehensive Plan of Action, concluded
    in 2015 under the previous administration. The agreement is described as defective
    at its core. Sanctions are reimposed. A better deal is promised. The parameters of
    the better deal have not been specified. Iran is advised to negotiate. Iran has
    not yet contacted us regarding a better deal.
  doctrine_rating: 8
  status: UNRESOLVED
  outcome: "Iran resumed uranium enrichment beyond JCPOA limits. No new deal concluded in Term 1. Maximum pressure campaign maintained. Term 2 negotiations ongoing. Iran's enrichment capacity described as advanced."

- id: abraham-accords
  title: "The Abraham Accords"
  strapline: "Normalisation agreements between Israel and the UAE, Bahrain, Sudan, and Morocco. Described as the most significant Middle East peace agreement in 25 years. The description is not inaccurate."
  date: 2020-09-15
  term: 1
  type: Alliance
  terms_and_conditions: >
    The United Arab Emirates and the Kingdom of Bahrain hereby agree to normalize
    relations with the State of Israel. Sudan and Morocco follow. The agreements are
    brokered by the United States and represent a significant realignment of regional
    diplomacy. Palestinian statehood is not addressed. This omission is noted by some
    parties. The administration considers the omission a feature of the framework.
  doctrine_rating: 10
  status: COMPLETED
  outcome: "Four normalisation agreements concluded. Embassies opened. Trade and security cooperation established. The Palestinian Authority was not consulted. A fifth accord with Saudi Arabia remains under negotiation."

- id: north-korea-summits
  title: "The North Korea Summit Series"
  strapline: "Three summits with Kim Jong-un. Singapore, Hanoi, the DMZ. Denuclearisation promised. Not delivered. The meetings are described as historic regardless."
  date: 2018-06-12
  term: 1
  type: Alliance
  terms_and_conditions: >
    The United States and the Democratic People's Republic of Korea agree to hold
    a historic summit in Singapore. A declaration is signed. Denuclearisation is
    committed to in general terms. A second summit in Hanoi produces no agreement.
    A third meeting at the DMZ lasts 53 minutes. No binding framework emerges.
    Kim Jong-un and the President exchange what are described as beautiful letters.
    The letters have not been published. North Korea's nuclear program has continued.
  doctrine_rating: 6
  status: UNRESOLVED
  outcome: "No denuclearisation agreement reached. North Korea conducted further missile tests. Contact ceased after Hanoi. The President has expressed continued openness to talks. North Korea has not responded."

- id: phase-one-china
  title: "The Phase One China Trade Deal"
  strapline: "Phase One of what was described as a comprehensive trade deal with China. Phase Two has not commenced. The tariffs from Phase One remain in place during Phase Two's absence."
  date: 2020-01-15
  term: 1
  type: Trade
  terms_and_conditions: >
    The United States and the People's Republic of China agree to a Phase One trade
    agreement. China commits to purchasing $200 billion in additional US goods over
    two years. The United States agrees to reduce some tariffs. Existing tariffs on
    $370 billion of Chinese goods remain. Phase Two negotiations are to follow.
    Phase Two has not been formally initiated. China's purchasing commitments were
    not fully met, in part due to the pandemic. The deal is described as a great deal.
  doctrine_rating: 7
  status: UNRESOLVED
  outcome: "China fell short of purchasing commitments. Some tariffs reduced, others maintained. Phase Two not commenced. Term 2 saw tariffs escalated to 145 percent before reduction to 30 percent following Geneva talks."

- id: liberation-day-tariffs
  title: "Liberation Day"
  strapline: "April 2, 2025. Universal baseline tariff of 10% applied to all countries. Reciprocal tariffs applied to 57 additional countries. The day is described as Liberation Day. Markets disagreed."
  date: 2025-04-02
  term: 2
  type: Trade
  terms_and_conditions: >
    Effective April 2, 2025, the United States imposes a universal baseline tariff
    of 10 percent on all imports from all countries. An additional reciprocal tariff
    layer is applied to 57 trading partners deemed to be acting unfairly. The methodology
    for calculating reciprocal tariffs is based on trade deficits divided by imports,
    multiplied by 0.5. Economists have described this methodology. Their description
    has not been flattering. The tariffs are applied regardless.
  doctrine_rating: 9
  status: ACTIVE
  outcome: "Global markets fell sharply. A 90-day pause was announced for most countries. China was excluded from the pause and tariffs escalated to 145 percent. The pause is described as a negotiating tool. Negotiations are ongoing."

- id: gaza-ceasefire-2025
  title: "The Gaza Ceasefire Agreement"
  strapline: "A ceasefire between Israel and Hamas brokered by the US, Qatar, and Egypt. Phase One implemented. Hostages released. Phase Two negotiations ongoing."
  date: 2025-01-19
  term: 2
  type: Alliance
  terms_and_conditions: >
    A ceasefire agreement between the State of Israel and Hamas is concluded in three
    phases. Phase One provides for a 42-day halt in fighting, the release of 33 hostages
    in exchange for Palestinian prisoners, and increased humanitarian aid to Gaza.
    The United States, Qatar, and Egypt serve as mediators. The agreement is announced
    one day before the presidential inauguration. The timing is noted.
  doctrine_rating: 8
  status: ACTIVE
  outcome: "Phase One implemented. Some hostages released. Phase Two negotiations commenced and proved difficult. Fighting resumed in phases. The situation in Gaza remains active and unresolved."

- id: ukraine-minerals-deal
  title: "The Ukraine Minerals Agreement"
  strapline: "Ukraine agrees to share revenues from its natural resource sector with the United States. Described as reimbursement for prior military assistance. Ukraine describes it differently."
  date: 2025-04-30
  term: 2
  type: Trade
  terms_and_conditions: >
    Ukraine and the United States conclude an agreement establishing a joint investment
    fund for reconstruction, to be funded in part by revenues from Ukraine's natural
    resources. The United States characterizes this as compensation for prior security
    assistance. Ukraine characterizes this as an investment partnership. The distinction
    is meaningful to Ukraine. A prior signing ceremony was disrupted when the President
    and President Zelensky had a disagreement in the Oval Office. This is noted for
    the record.
  doctrine_rating: 6
  status: ACTIVE
  outcome: "Agreement signed April 30, 2025. Implementation framework under development. Ceasefire negotiations with Russia continue separately. Ukraine's sovereignty is described as important by both parties with varying degrees of conviction."

- id: saudi-investment-pledge
  title: "The Saudi Investment Arrangement"
  strapline: "$600 billion in investment pledged by Saudi Arabia over four years. The President's first foreign visit of Term 2. MBS described as doing a spectacular job. The feeling appears mutual."
  date: 2025-05-13
  term: 2
  type: Alliance
  terms_and_conditions: >
    During a state visit to the Kingdom of Saudi Arabia — the first foreign visit of
    the second term, as it was the first foreign visit of the first term — the Kingdom
    pledges $600 billion in investment in the United States over four years. Arms sales
    agreements are concluded. Crown Prince Mohammed bin Salman is described as doing
    a spectacular job. The murder of journalist Jamal Khashoggi is not raised publicly.
    This approach is described as pragmatic.
  doctrine_rating: 9
  status: ACTIVE
  outcome: "Investment pledges announced. Arms packages confirmed. Strategic partnership deepened. A Trump-branded golf course development in Saudi Arabia was separately noted by ethics observers. The observation was not acted upon."

- id: paris-accord-withdrawal
  title: "The Paris Climate Exit"
  strapline: "The United States withdraws from the Paris Climate Agreement. Re-enters under Biden. Withdraws again under Trump. The climate has continued regardless."
  date: 2017-06-01
  term: 1
  type: Alliance
  terms_and_conditions: >
    The United States hereby withdraws from the Paris Agreement on Climate Change,
    concluded in 2015 and ratified by 196 parties. The agreement is described as
    unfair to the United States. The United States re-enters in 2021 under the Biden
    administration. The United States withdraws again in 2025. This is the second
    withdrawal from the same agreement. A record has been established.
  doctrine_rating: 8
  status: ACTIVE
  outcome: "Second withdrawal effective. The agreement continues without US participation. Global temperatures have not paused pending resolution of the dispute."

- id: tpp-withdrawal
  title: "The Trans-Pacific Partnership Exit"
  strapline: "The US withdraws from the TPP on Day 3 of the first term. Eleven remaining parties conclude the agreement without the US. The US later expresses interest in rejoining on better terms."
  date: 2017-01-23
  term: 1
  type: Trade
  terms_and_conditions: >
    Three days into the first term, the United States withdraws from the Trans-Pacific
    Partnership, a trade agreement covering 12 nations and 40 percent of the global
    economy. The agreement is described as a disaster. The remaining 11 parties
    conclude their own version, the CPTPP, and it enters into force. The United States
    is not in it. The United States has not rejoined. The absence is described as
    a matter of principle.
  doctrine_rating: 7
  status: COMPLETED
  outcome: "CPTPP entered into force without the US. The 11 remaining parties proceeded. US trade with the region continues via bilateral arrangements. The bilateral arrangements are described as better."

- id: who-withdrawal
  title: "The WHO Departure (First and Second)"
  strapline: "The US withdraws from the World Health Organization in 2020. Rejoins in 2021. Withdraws again in 2025. The WHO has noted the pattern."
  date: 2020-07-07
  term: 1
  type: Alliance
  terms_and_conditions: >
    The United States withdraws from the World Health Organization with effect from
    July 2021, citing mismanagement and China's influence over the organization.
    The withdrawal is reversed by the incoming Biden administration. A second withdrawal
    is executed in January 2025 on Day 1 of the second term. Withdrawal paperwork is
    signed before the inaugural address is delivered. Priorities are noted.
  doctrine_rating: 6
  status: ACTIVE
  outcome: "Second withdrawal processed. The WHO continues to function. US financial contributions ceased. The gap is being filled by other member states. The arrangement is described as very unfair to America."

- id: nato-spending-ultimatum
  title: "The NATO 2% Ultimatum"
  strapline: "NATO allies told to pay 2% of GDP on defense or the US will not protect them. Several allies increase spending. The statement is described as a negotiating tactic. Also as policy. Both simultaneously."
  date: 2018-07-11
  term: 1
  type: Alliance
  terms_and_conditions: >
    The United States hereby informs NATO member states that failure to meet the
    2 percent of GDP defense spending target will result in the United States
    declining to provide security guarantees. The statement is made at a NATO summit.
    Several allies increase spending. The President declares victory. The 2 percent
    target is subsequently revised upward to 5 percent in Term 2. The bar has moved.
  doctrine_rating: 8
  status: ACTIVE
  outcome: "NATO defense spending increased among most members. The 5% target announced in Term 2. Several allies are working toward the new figure. The old figure is no longer sufficient. This was not communicated in advance."

- id: iran-2025-negotiations
  title: "The Iran Nuclear Talks (Ongoing)"
  strapline: "Maximum pressure reapplied. Talks offered. Talks rejected. Talks accepted. Framework discussed. Deadline set. Deadline extended. Deadline reset. Iran enriches uranium throughout."
  date: 2025-02-01
  term: 2
  type: Alliance
  terms_and_conditions: >
    Having withdrawn from the JCPOA in Term 1 and reimposed sanctions, the United
    States opens a new channel for negotiations with Iran. A deadline for agreement
    is set for May 2025. The deadline passes. A new deadline is set. Iran attends
    talks in Oman. A framework is discussed. Iran's enrichment capacity is described
    as a problem. The problem continues during the talks. The talks continue during
    the problem. The situation is described as moving in a positive direction.
  doctrine_rating: 6
  status: ACTIVE
  outcome: "Negotiations ongoing as of publication. Multiple rounds of talks conducted through Oman. No binding framework reached. Iran continues enriching. The US continues threatening. The arrangement is described as a deal being made."

- id: south-korea-defense-cost
  title: "The South Korea Defense Bill"
  strapline: "South Korea asked to pay significantly more for the presence of 28,500 US troops. A new cost-sharing agreement eventually reached. The troops remain. So does the negotiation."
  date: 2019-02-10
  term: 1
  type: Alliance
  terms_and_conditions: >
    The United States informs the Republic of Korea that existing cost-sharing
    arrangements for US Forces Korea are inadequate. A substantial increase is requested.
    South Korea declines the initial figure. Negotiations extend across multiple years
    and both Trump administrations. An agreement is eventually reached. The terms are
    described as much better. The previous terms are described as terrible. South Korea
    describes the process as difficult.
  doctrine_rating: 6
  status: ACTIVE
  outcome: "Cost-sharing agreement updated. South Korea pays more. The figure is less than initially requested. The troops remain. The process is expected to repeat."

- id: tiktok-deal-i
  title: "The TikTok Arrangement (First Attempt)"
  strapline: "TikTok given 90 days to sell or be banned. Oracle and Walmart selected as buyers. Deal announced. Deal not completed. Trump leaves office. Deal paused."
  date: 2020-08-06
  term: 1
  type: Trade
  terms_and_conditions: >
    ByteDance is ordered to divest TikTok's US operations within 90 days or face
    a ban. Oracle and Walmart are identified as preferred acquirers. A deal structure
    is announced involving a new entity, TikTok Global. The deal is described as
    great for America. The deal is not completed before the end of the term. The
    Biden administration reviews the situation. The situation is not resolved. TikTok
    continues operating.
  doctrine_rating: 5
  status: UNRESOLVED
  outcome: "Sale not completed in Term 1. Ban legislation passed by Congress in 2024. TikTok briefly went dark on January 19, 2025. Service restored January 20, 2025 — inauguration day. The timing is a coincidence."

- id: tiktok-deal-ii
  title: "The TikTok Arrangement (Revised)"
  strapline: "TikTok restored on inauguration day. A new 90-day extension granted. Then another. The ban law remains on the books. TikTok operates. The deal is described as imminent."
  date: 2025-01-20
  term: 2
  type: Trade
  terms_and_conditions: >
    Upon taking office, the President directs the Justice Department not to enforce
    the TikTok ban for 90 days, pending a deal. The 90-day period expires. A further
    extension is granted. The preferred structure involves a 50 percent US ownership
    stake. Various buyers are discussed. The deal is described as coming together
    very well. It has not yet come together. TikTok operates throughout.
  doctrine_rating: 5
  status: ACTIVE
  outcome: "Multiple extensions granted. Deal structure debated. No sale completed as of publication. TikTok remains operational. The ban law remains on the books. All parties describe a deal as close."

- id: colombia-deportation-deal
  title: "The Colombia Arrangement"
  strapline: "Colombia refuses US military deportation flights. Tariffs threatened within hours. Colombia accepts the flights. Tariffs suspended within hours. A case study in the doctrine in action."
  date: 2025-01-26
  term: 2
  type: Alliance
  terms_and_conditions: >
    Colombia declines to accept US military aircraft carrying deported Colombian
    nationals. The United States responds within hours with a schedule of tariffs:
    25 percent immediately, rising to 50 percent within a week, plus visa restrictions
    and Treasury Department sanctions. Colombia accepts the deportation flights.
    The threatened tariffs are suspended. The entire sequence occurs within 24 hours.
    It is presented as a deal. It functions as a deal. It is the doctrine operating
    at full speed.
  doctrine_rating: 9
  status: COMPLETED
  outcome: "Flights accepted. Tariffs not applied. Relationship normalized at a new equilibrium in which Colombia's cooperation is no longer assumed but priced."

- id: el-salvador-prison-deal
  title: "The El Salvador Prison Partnership"
  strapline: "The US pays El Salvador to house deported migrants in its prison system. President Bukele's mass incarceration policies praised. The arrangement is described as innovative."
  date: 2025-03-15
  term: 2
  type: Alliance
  terms_and_conditions: >
    The United States and El Salvador conclude an arrangement whereby El Salvador
    agrees to receive and detain individuals deported from the United States, including
    persons whose deportation is contested in US courts. El Salvador receives financial
    compensation. President Nayib Bukele's CECOT megaprison is used for this purpose.
    Bukele's broader approach to criminal justice is described as what we should be
    doing. A legal challenge in US courts has noted concerns. The arrangement continues.
  doctrine_rating: 8
  status: ACTIVE
  outcome: "Deportees housed in El Salvador. Several cases challenged in US courts. The Supreme Court has weighed in on process questions. The administration describes the legal challenges as obstruction."

- id: qatar-747-arrangement
  title: "The Qatari Aircraft Gift"
  strapline: "Qatar offers a luxury Boeing 747-8 as a gift to the United States. The plane is to serve as Air Force One. Ethics concerns are raised. The plane is accepted."
  date: 2025-05-11
  term: 2
  type: Alliance
  terms_and_conditions: >
    The State of Qatar offers a Boeing 747-8 jumbo jet, valued at approximately
    $400 million, as a gift to the United States government for use as a presidential
    aircraft. The offer is accepted. The Pentagon is designated as the recipient.
    Ethics lawyers note that accepting gifts from foreign governments is constrained
    by the Constitution's Emoluments Clause. This constraint is described as not
    applicable. The plane is described as very nice. Qatar hosts the largest US
    military base in the Middle East. These facts are presented separately.
  doctrine_rating: 7
  status: ACTIVE
  outcome: "Plane accepted. Ethics review ongoing. Legal challenges filed. The aircraft requires modification before presidential use. The modification timeline is described as fast."

- id: houthi-ceasefire
  title: "The Yemen Ceasefire Announcement"
  strapline: "US strikes against Houthi targets suspended after the Houthis agree to stop attacking US ships. The Houthis continue attacking other ships. The deal is described as done."
  date: 2025-05-06
  term: 2
  type: Alliance
  terms_and_conditions: >
    The United States and the Houthi movement of Yemen conclude an informal
    ceasefire arrangement under which the United States agrees to halt strikes
    against Houthi targets in Yemen. The Houthis agree to halt attacks on US
    naval vessels in the Red Sea. Attacks on vessels of other nationalities
    are not addressed by the arrangement. The arrangement is described as a deal.
    It is announced via social media. The Houthis confirm it. Several
    US allies express surprise.
  doctrine_rating: 5
  status: ACTIVE
  outcome: "US strikes halted. Houthi attacks on non-US shipping continue. Saudi Arabia and the UAE, not consulted, note the development. Israel, also not consulted, notes the development. The situation is described as resolved."

- id: uk-trade-framework
  title: "The UK Trade Framework"
  strapline: "A trade deal framework announced with the United Kingdom. Not a full trade deal. The framework for a deal. The announcement is treated as the deal. Details to follow."
  date: 2025-05-08
  term: 2
  type: Trade
  terms_and_conditions: >
    The United States and the United Kingdom announce a trade deal framework.
    The framework is not a trade agreement. The framework describes the shape
    of a potential trade agreement to be negotiated. The UK's 10 percent tariff
    remains in place. The UK retains some agricultural standards that may affect
    final terms. The special relationship is described as special. The announcement
    is celebrated. The actual agreement will take longer. This is not mentioned
    prominently.
  doctrine_rating: 6
  status: ACTIVE
  outcome: "Framework announced May 8, 2025. Full agreement not yet concluded. Tariffs remain. Both sides describe progress. The progress is real. The deal is not yet."

- id: geneva-china-talks
  title: "The Geneva De-escalation"
  strapline: "US and China meet in Geneva. Tariffs reduced from 145% to 30% for 90 days. Described as a great deal. The tariffs were set at 145% six weeks earlier. Context is noted."
  date: 2025-05-12
  term: 2
  type: Trade
  terms_and_conditions: >
    Following the escalation of tariffs to 145 percent on Chinese goods in April 2025,
    negotiators from the United States and the People's Republic of China meet in Geneva.
    An agreement is reached to reduce tariffs to 30 percent for a 90-day period.
    The 90-day pause mirrors the pause announced for other countries in April.
    China reduces its retaliatory tariffs on US goods. The outcome is described
    as a great deal. The tariffs remain at 30 percent. 30 percent is higher than
    the pre-Liberation Day rate. This is not the headline.
  doctrine_rating: 7
  status: ACTIVE
  outcome: "Tariffs reduced to 30% for 90 days. Talks to continue. Phase Two discussions beginning. The 90-day period is expected to produce either a deal or a new escalation. Previous 90-day periods are instructive."

- id: gulf-of-america
  title: "The Gulf of Mexico Renaming"
  strapline: "The Gulf of Mexico renamed the Gulf of America by executive order. Mexico disagrees. The United Nations has not updated its maps. Google Maps updated for US users. The gulf itself has not commented."
  date: 2025-01-20
  term: 2
  type: Miscellaneous
  terms_and_conditions: >
    By executive order dated January 20, 2025, the body of water known internationally
    as the Gulf of Mexico is hereby renamed the Gulf of America for purposes of
    United States federal government usage. The renaming is effective immediately.
    Mexico has not agreed to the renaming. Mexico continues to call it the Gulf of Mexico.
    International bodies continue to use the prior designation. The renaming is described
    as long overdue. The rationale for its overdue nature has not been specified.
  doctrine_rating: 6
  status: ACTIVE
  outcome: "Federal agencies use Gulf of America. Google Maps updated the name for users in the United States. International maps have not changed. The water remains in the same location."

- id: nippon-steel-block
  title: "The Nippon Steel Veto"
  strapline: "Nippon Steel's $14.9 billion acquisition of US Steel blocked on national security grounds. US Steel's future remains uncertain. The blocking is described as protecting American workers."
  date: 2025-01-03
  term: 2
  type: Trade
  terms_and_conditions: >
    The proposed acquisition of United States Steel Corporation by Nippon Steel
    Corporation of Japan, a US treaty ally, is blocked by presidential order on
    national security grounds. The acquisition was reviewed by CFIUS and found
    to present national security concerns. Japan's government objects. The United
    Steelworkers union supports the block. US Steel's operational future is subject
    to ongoing review. The blocking is presented as a deal for American workers.
    No alternative acquirer has been identified.
  doctrine_rating: 7
  status: COMPLETED
  outcome: "Acquisition blocked. Nippon Steel pursuing legal challenge. US Steel's future uncertain. No US buyer has emerged. The steelworkers' union's position on the outcome has evolved."

- id: trump-tower-baku
  title: "The Greenland Purchase Offer (Formal)"
  strapline: "Trump formally offers to purchase Greenland. Price not specified. Payment method not specified. Denmark not consulted in advance. The offer is described as serious."
  date: 2025-03-28
  term: 2
  type: Territorial
  terms_and_conditions: >
    The United States makes a formal offer to purchase Greenland from the Kingdom of
    Denmark, following up on the informal offer of Term 1. The purchase price is not
    disclosed. The method of transfer is not specified. Danish consent is presumed
    obtainable. Greenland's own government has called for independence from Denmark,
    which the United States describes as consistent with US goals. That Greenland's
    independence and US purchase are different outcomes is a distinction the offer
    does not address.
  doctrine_rating: 9
  status: ACTIVE
  outcome: "Denmark has not accepted. Greenland's government has not accepted. The offer remains open. The offer is described as the most generous territorial offer in modern history by the offering party."

- id: nato-article-5-ambiguity
  title: "The Article 5 Clarification"
  strapline: "The President declines to confirm whether the US would defend NATO allies who haven't met spending targets. The clarification is described as a negotiating position. Allies describe it as something else."
  date: 2024-02-10
  term: 1
  type: Alliance
  terms_and_conditions: >
    At a campaign rally, the President states that he would not protect NATO allies
    who fail to meet defense spending targets and would in fact encourage Russia to
    do whatever it wanted with them. This statement is subsequently described as
    a negotiating tactic. NATO's Article 5 mutual defense commitment is not formally
    withdrawn. Its unconditional nature is, however, described as conditional.
    Allies note the distinction. The distinction is significant. NATO spending
    increases.
  doctrine_rating: 8
  status: ACTIVE
  outcome: "NATO spending increased among members. Article 5 not formally amended. The ambiguity remains as policy. Russia has cited the statement. The citation is described as a mischaracterisation."

- id: india-tariff-standoff
  title: "The India Tariff Situation"
  strapline: "India described as a very big abuser of tariffs. 26% Liberation Day tariff applied. Modi relationship described as great. The tariff is described as reciprocal. India's actual tariff on US goods differs from the calculation used."
  date: 2025-04-02
  term: 2
  type: Trade
  terms_and_conditions: >
    The United States applies a 26 percent tariff to Indian goods as part of the
    Liberation Day framework, citing India's high tariff rates on US products.
    The reciprocal tariff calculation divides the US trade deficit with India by
    total imports and applies 50 percent of the result. This methodology produces
    the 26 percent figure. India's actual average tariff on US goods is different.
    Prime Minister Modi's relationship with the President is described as excellent.
    The tariff applies regardless of the relationship.
  doctrine_rating: 6
  status: ACTIVE
  outcome: "Tariff applied. India seeking negotiated reduction. Talks ongoing. Modi visit to Washington discussed. Golf has been played previously by both parties. The tariff has not been waived for golf."

- id: mexico-wall-final-accounting
  title: "The Wall Payment Resolution"
  strapline: "Mexico was going to pay for the wall. Mexico has not paid for the wall. US taxpayers have paid for portions of the wall. The arrangement is described as complicated."
  date: 2017-01-25
  term: 1
  type: Miscellaneous
  terms_and_conditions: >
    Mexico is to pay for the construction of a wall along the United States–Mexico
    border. This commitment is made repeatedly and with certainty. Mexico declines
    to pay. Various mechanisms are proposed: tariffs on Mexican goods (indirect payment),
    remittance taxes (also not implemented), seizure of drug cartel assets. Congress
    appropriates US funds for partial construction. Emergency declarations are used
    to redirect military construction funds. Mexico has paid nothing. The wall is
    partially built.
  doctrine_rating: 7
  status: UNRESOLVED
  outcome: "Several hundred miles of barrier constructed or replaced using US funds. Mexico has not paid. The payment mechanism remains theoretical. The wall is real, partially. The payment is not, entirely."

- id: russia-ukraine-ceasefire-attempt
  title: "The Ukraine Peace Process (Ongoing)"
  strapline: "The war to be ended in 24 hours. Then in the first term. Then very quickly. A ceasefire remains 24 hours away on a rolling basis. Progress is described as being made."
  date: 2025-02-12
  term: 2
  type: Alliance
  terms_and_conditions: >
    The President commits to ending the Russia–Ukraine war quickly. The precise timeline
    has been revised on multiple occasions. Envoy Keith Kellogg is appointed.
    President Zelensky visits Washington and is publicly dressed down regarding
    his negotiating position. Aid is paused. A minerals agreement is signed.
    Russia's demands are characterized as reasonable by some administration officials
    and unreasonable by others. Ukraine's territory remains partially occupied.
    A ceasefire is described as imminent at regular intervals.
  doctrine_rating: 5
  status: ACTIVE
  outcome: "No ceasefire as of publication. Ukraine retains most of its pre-2022 territory. Russia retains occupied territory. Talks continue. The 24-hour timeline has been superseded by events but not formally revised."

- id: venezuela-guaido-recognition
  title: "The Venezuela Transition Arrangement"
  strapline: "Juan Guaidó recognized as Venezuela's legitimate president. Maduro remains in power. Guaidó is no longer recognized by anyone. Maduro remains in power."
  date: 2019-01-23
  term: 1
  type: Alliance
  terms_and_conditions: >
    The United States recognizes National Assembly leader Juan Guaidó as the
    legitimate interim president of Venezuela, refusing to acknowledge the Maduro
    government. 50-plus countries follow. Maduro retains control of the military,
    the state apparatus, and the country. A military uprising on April 30, 2019,
    does not succeed. Guaidó's recognition is gradually withdrawn by other countries.
    The US position evolves. Maduro remains. Sanctions continue.
  doctrine_rating: 4
  status: COMPLETED
  outcome: "Maduro remains in power. Guaidó recognition withdrawn by most countries. Guaidó lives in exile. Sanctions on Venezuela maintained. The arrangement is described as having applied maximum pressure. The pressure did not transfer power."

- id: syria-sanctions-relief
  title: "The Syria Sanctions Lift"
  strapline: "Sanctions on Syria lifted following the fall of Assad. The new government is given a chance. The chance is time-limited. Progress is expected. The bar for progress has not been specified."
  date: 2025-03-01
  term: 2
  type: Alliance
  terms_and_conditions: >
    Following the fall of Bashar al-Assad in December 2024 and the assumption of
    power by HTS-led transitional authorities, the United States agrees to lift
    sanctions on Syria. The decision is described as giving Syria a chance. Conditions
    for maintained sanctions relief include the formation of an inclusive government,
    protection of minorities, and counterterrorism commitments. HTS itself remains
    designated as a terrorist organization. The sanctions are lifted regardless.
    The designation question is under review.
  doctrine_rating: 6
  status: ACTIVE
  outcome: "Sanctions lifted. US diplomats in Damascus. HTS designation under review. The new Syrian government has engaged with US envoys. The situation is described as an opportunity. The outcome remains to be determined."

- id: eu-tariff-negotiations
  title: "The EU Tariff Standoff"
  strapline: "The European Union told it has been ripping off the United States for years. 20% tariff applied. Retaliatory measures threatened. Negotiations opened. The negotiations are taking longer than the tariffs."
  date: 2025-04-02
  term: 2
  type: Trade
  terms_and_conditions: >
    The European Union is subject to a 20 percent Liberation Day tariff on the basis
    that it has maintained unfair trade practices against the United States. The EU
    responds with a list of retaliatory tariffs, then pauses the list pending talks.
    The US pauses the 20 percent tariff for 90 days for most EU goods while maintaining
    the baseline 10 percent. Negotiations begin. The EU insists on a zero-tariff
    outcome. The US insists on a revised trading relationship. The gap between these
    positions is described as bridgeable.
  doctrine_rating: 7
  status: ACTIVE
  outcome: "Talks ongoing. 90-day pause in effect. EU retaliatory list suspended but not withdrawn. Both sides describe willingness to do a deal. A deal has not been done. The 90-day clock is running."

- id: imf-world-bank-review
  title: "The Multilateral Institution Review"
  strapline: "The IMF and World Bank described as instruments of globalisation not serving American interests. A review ordered. The institutions continue to function. The review continues."
  date: 2025-02-20
  term: 2
  type: Miscellaneous
  terms_and_conditions: >
    The administration orders a review of US participation in and funding for
    multilateral financial institutions including the IMF and World Bank. The
    institutions are described as not aligned with America First principles.
    The review is ongoing. US funding continues during the review. The review
    has not produced formal recommendations as of publication. The institutions
    describe the review as a matter for the member state to determine.
  doctrine_rating: 4
  status: ACTIVE
  outcome: "Review ongoing. No withdrawal announced. Funding under scrutiny. The institutions continue operating. The outcome of the review is expected to produce leverage. Leverage over multilateral institutions is a complex instrument."
