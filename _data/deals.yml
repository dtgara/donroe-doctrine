- id: eu-tariff-negotiations
  title: The EU Tariff Standoff
  strapline: The European Union told it has been ripping off the United States for years. 20% tariff applied. Retaliatory
    measures threatened. Negotiations opened. The negotiations are taking longer than the tariffs.
  date: 2025-04-02
  term: 2
  type: Trade
  terms_and_conditions: 'The European Union is subject to a 20 percent Liberation Day tariff on the basis that it has maintained
    unfair trade practices against the United States. The EU responds with a list of retaliatory tariffs, then pauses the
    list pending talks. The US pauses the 20 percent tariff for 90 days for most EU goods while maintaining the baseline 10
    percent. Negotiations begin. The EU insists on a zero-tariff outcome. The US insists on a revised trading relationship.
    The gap between these positions is described as bridgeable.

    '
  doctrine_rating: 7
  status: COMPLETED
  outcome: >-
    A framework agreement was struck in mid-2025 setting a 15 percent all-inclusive US tariff ceiling on most EU goods
    (autos down from 27.5 percent), with the EU eliminating duties on US industrial goods and opening preferential access
    for select agricultural products. The Council of the EU adopted the two implementing regulations on June 25, 2026,
    and the agreement took effect July 1, 2026. Steel and aluminium remain outside the deal at a 50 percent Section 232
    rate. The bridgeable gap closed at 15 percent -- short of the EU's original zero-tariff ask.
