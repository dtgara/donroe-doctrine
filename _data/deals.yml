  date: '2026-07-01'
  term: 2
  type: Trade
  status: UNRESOLVED
  summary: >-
    July 1, 2026 marked the mandatory six-year joint review deadline under the US-Mexico-Canada Agreement, at which all
    three parties were required to confirm whether to extend the pact automatically for a further sixteen years. The Trump
    administration declined to confirm renewal. US Trade Representative Jamieson Greer said "the United States did not
    agree to renew the USMCA in its current form," citing the agreement's "shortcomings" and persistent US trade deficits
    with Mexico and Canada. USMCA remains in force under its original sunset clause through July 2036, but the non-renewal
    triggers a mandatory annual review process rather than the automatic extension both Mexico and Canada had sought. A
    third round of talks with Mexico convened in Mexico City July 21-23, 2026, covering steel and aluminum tariffs, automotive
    rules of origin, and Chinese investment in Mexican factories allegedly used to route goods around US tariffs; USTR
    Greer met separately with Mexican President Sheinbaum at the National Palace. No agreement announced at the round's
    close.
  terms_and_conditions: >-
    USMCA remains in force through July 2036 under its original sunset clause. Automatic sixteen-year renewal declined by
    the United States. Annual joint reviews triggered in its place. Bilateral talks with Mexico and Canada to continue on
    trade deficits and unspecified "shortcomings." No new tariffs imposed as a direct consequence of this decision.
- id: us-saudi-nuclear-deal-2026
  title: The US-Saudi Nuclear Cooperation Agreement
  strapline: A thirty-year civil nuclear pact. Enrichment on the table Wednesday. Off the table Thursday. Congress reviews Friday.
  date: '2026-07-22'
  term: 2
  type: Miscellaneous
  status: UNRESOLVED
  summary: >-
    On July 22, 2026, US Energy Secretary Chris Wright and Saudi Minister of Energy Abdulaziz bin Salman signed a "123
    agreement" nuclear cooperation pact alongside a bilateral safeguards agreement, committing Saudi Arabia to use US
    firms to supply its reactors over a thirty-year term. US officials briefed on the deal told reporters it left open
    a pathway for Saudi Arabia to enrich its own reactor fuel following a joint US-Saudi study, without adopting the
    "gold standard" of international oversight that bars enrichment outright. The agreement was signed during the
    US-Israel war against Iran, waged in part to prevent Iranian enrichment. The following day, Trump posted on Truth
    Social that the deal permits no enrichment at all and is "totally subject" to Saudi Arabia joining the Abraham
    Accords, a condition absent from the deal as announced (see Contradiction Tracker c065). The agreement next goes
