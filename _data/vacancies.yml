incidents:
  - id: vac001
    date: "2026-02-10"
    term: 2
    type: mass_recall
    countries: [Rwanda, Nigeria, Niger]
    headline: "Mass recall leaves over half of sub-Saharan Africa without a US ambassador"
    detail: >-
      AFSA confirmed the recall of 31 ambassadors by February 10, 2026; AP
      reporting put the figure at 13 chiefs of mission recalled specifically,
      bringing total Africa vacancies to roughly 30 posts — more than half
      the countries in sub-Saharan Africa. Rwanda, Nigeria, and Niger were
      named among the posts affected. Niger's recall came the same year a US
      missionary pilot was kidnapped in-country. The administration cited a
      pivot from aid-based to "business-focused" diplomacy — trade deals and
      rare-earth agreements in place of career diplomatic presence. The Africa
      Bureau's senior career official, Jonathan Pratt, retired around the
      same period.
    appointee:
    donor_amount_usd:
    career_background:
    source: "AP, via The Business Standard; AFSA"
    source_url: "https://www.tbsnews.net/worldbiz/usa/trumps-recall-ambassadors-compounds-staffing-problems-posts-africa-1317896"
    notes: "Anchor incident for the register — a single dated event, not an accumulation of unrelated vacancies."

  - id: vac002
    date: "2026-03-11"
    term: 2
    type: donor_disclosure
    countries: []
    headline: "Ambassador nominees' pre-nomination donations total roughly $60 million"
    detail: >-
      Trump's second-term ambassador nominees collectively donated
      approximately $60 million to Trump and Republican committees in the
      two years preceding their nomination — roughly three times what
      Biden's non-career ambassador nominees and their spouses gave over a
      full decade. Of 101 second-term ambassador appointments recorded by
      AFSA, only 9 (8.9%) went to career Foreign Service officers against
      92 (91.1%) political appointees — a sharp break from both Trump's own
      first term (43.5% political) and the roughly two-thirds-career norm
      both parties have kept since the 1950s. In 2025, only six Foreign
      Service officers were nominated to ambassadorial posts at all
      (Bahrain, Bangladesh, Jordan, Kazakhstan, Sri Lanka, Thailand),
      against 64 political nominees over the same period.
    appointee:
    donor_amount_usd: 60000000
    career_background:
    source: "AFSA, 'The Marginalization of Career Diplomats'"
    source_url: "https://afsa.org/marginalization-career-diplomats"
    notes: "Aggregate, not attributable to a single post — logged as a standalone incident rather than forced onto one country's row in the posts roster."

  - id: vac003
    date: "2025-01-20"
    term: 2
    type: notable_appointment
    countries: [Bahamas]
    headline: "Herschel Walker confirmed as ambassador to the Bahamas"
    detail: >-
      Former NFL and USFL running back Herschel Walker, a 2022 US Senate
      candidate in Georgia with no prior diplomatic background, was
      confirmed as US ambassador to the Bahamas.
    appointee: Herschel Walker
    donor_amount_usd:
    career_background: "Professional football player and 2022 Senate candidate; no prior diplomatic or foreign policy background."
    source: "Multiple outlets; Senate confirmation record"
    source_url:
    notes: "Illustrative case for the political-appointee pattern documented in vac002. Date reflects confirmation-cycle timing, not independently verified to the day."

  - id: vac004
    date: "2025-10-07"
    term: 2
    type: procedural_change
    countries: []
    headline: "Senate confirms 107 nominees in bulk after rules change to simple-majority group votes"
    detail: >-
      The Senate confirmed 107 Trump nominees — including more than two
      dozen ambassadors, agency heads, and US attorneys — in a single push
      after changing its procedural rules to allow lower-level nominees to
      be considered in groups by simple majority, rather than individually.
      Ambassadors to India, Poland, and Denmark were among those confirmed
      in the batch. The change cleared the bulk of a confirmation backlog
      that had left 26 committee-approved nominees awaiting floor votes.
    appointee:
    donor_amount_usd:
    career_background:
    source: "Washington Times"
    source_url: "https://www.washingtontimes.com/news/2025/oct/7/senate-confirms-107-trump-nominees-clearing-bulk-backlog/"
    notes: "Reduces individual scrutiny per nominee in exchange for clearing the backlog — a process story in its own right, not just a numbers story."

  - id: vac005
    date: "2026-04-14"
    term: 2
    type: notable_appointment
    countries: [South Korea]
    headline: "South Korea ambassadorship filled after 15-month vacancy and a rotating cast of acting chargés"
    detail: >-
      The Seoul post went vacant when Ambassador Philip Goldberg departed in
      January 2025. Kevin Kim served as acting chargé d'affaires before
      leaving the post himself; James "Jim" Heller then took over as acting
      chargé d'affaires ad interim. Former US Congresswoman Michelle Park
      Steel was nominated and Senate-confirmed in April 2026 — roughly
      fifteen months after the vacancy began — becoming the second Korean
      American and second woman to hold the post.
    appointee: Michelle Park Steel
    donor_amount_usd:
    career_background: "Former US Congresswoman representing California; no prior diplomatic background."
    source: "Stars and Stripes; Korea Herald; Korea Times"
    source_url: "https://www.stripes.com/theaters/asia_pacific/2026-04-14/michelle-park-steel-south-korea-ambassador-21370409.html"
    notes: "Logged as a distinct incident rather than folded into the posts roster row because the rotating-acting-official pattern, not just the eventual fill, is the point — a major treaty ally went over a year without a confirmed US ambassador."
