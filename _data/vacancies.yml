# The Vacancies — US Ambassador Vacancy Register
# Two top-level keys: `posts` (per-country roster, bulk-synced against AFSA's
# tracker on a rolling basis — NOT individually primary-sourced the way
# strongmen.yml/epithets.yml/central_casting.yml entries are) and `incidents`
# (narrative register of specific documented events — recalls, notable
# appointments, procedural changes — which ARE individually primary-sourced).
#
# Status: incomplete by design. The `posts` roster below covers the Africa,
# Americas, and Oceania vacancies itemized in available reporting on the
# State Department's "Ambassadorial Assignments Overseas" document. Europe,
# Asia, and Middle East vacancies are known to exist (117 countries total
# per the same document) but were not itemized in the source article used
# to seed this register — a gap for a future sprint to close against the
# primary document directly.
#
# Last updated: 2026-07-03

snapshot_date: "2026-04-08"
snapshot_source: "US Dept. of State, 'Ambassadorial Assignments Overseas'; reported via Punch/PRIMA News; cross-referenced against AFSA Ambassador Tracker"
snapshot_source_url: "https://afsa.org/list-ambassadorial-appointments"
snapshot_total_vacant: 117
snapshot_note: >-
  117 countries lacked a Senate-confirmed US ambassador as of the snapshot
  date. A separate rolling count put total worldwide vacancies at "at least
  110" once ~80 pre-existing vacancies were added to a wave of early-2026
  recalls. 76 of the 117 vacant posts are itemized below from the Africa,
  Americas, and Oceania reporting; the remainder span Europe, Asia, and the
  Middle East and were largely unsourced until a targeted follow-up pass
  against individual embassy leadership pages (e.g. [country].usembassy.gov)
  added Germany and Saudi Arabia as confirmed vacant/acting posts, plus five
  filled posts (UK, Israel, Japan, Mexico, South Korea) for status contrast.
  That per-post lookup method works and scales — see incident vac005 for an
  example of what it turns up — but has only been run against a small,
  strategically-selected sample so far, not the full remaining list.

