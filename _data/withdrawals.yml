- id: paris-agreement
  agreement: Paris Climate Agreement
  category: environment
  summary: The 2015 international framework committing nations to limit global warming to 1.5–2°C above pre-industrial levels.
    196 parties. Entered into force November 2016.
  term_1_date: '2017-06-01'
  term_1_effective: '2019-11-04'
  biden_rejoined: '2021-01-20'
  term_2_date: '2025-01-20'
  term_2_effective: '2026-01-27'
  current_status: withdrawn_twice
  notes: One of Trump's first acts in both terms. The only country to withdraw twice. Biden re-joined on his first day in
    office; Trump re-withdrew on his. As of January 2026, the US is no longer legally bound by its carbon commitments. Rubio
    described the Paris Agreement as contrary to US interests.
- id: unfccc
  agreement: UN Framework Convention on Climate Change (UNFCCC)
  category: environment
  summary: The foundational 1992 climate treaty on which the Paris Agreement is built. Senate-ratified. Provides the international
    framework for all climate negotiations.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: null
  current_status: withdrawn
  notes: 'Included in the January 2026 executive order withdrawing from 66 international organisations. More significant than
    leaving the Paris Agreement: this withdraws from the entire legal architecture for global climate negotiations. As a Senate-ratified
    treaty, the withdrawal''s legality faces expected challenge.'
- id: ipcc
  agreement: Intergovernmental Panel on Climate Change (IPCC)
  category: environment
  summary: The UN body that synthesises global climate science for policymakers. Founded 1988. Produces the authoritative
    Assessment Reports that form the scientific basis for international climate policy.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: null
  current_status: withdrawn
  notes: Included in the January 2026 executive order. The US contributed approximately $2 million annually to the IPCC. Rubio
    described it as wasteful. The IPCC's most recent report cited the US as the largest historical emitter of greenhouse gases.
- id: irena
  agreement: International Renewable Energy Agency (IRENA)
  category: environment
  summary: Intergovernmental organisation supporting countries in their transition to renewable energy. 168 members. Founded
    2009 partly through US initiative.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: null
  current_status: withdrawn
  notes: Included in the January 2026 executive order. The US was a founding supporter of IRENA under the George W. Bush administration.
    Withdrawal came weeks after the administration approved record domestic oil and gas leasing.
- id: who
  agreement: World Health Organization (WHO)
  category: health
  summary: The UN specialised agency for international public health, founded 1948. Coordinates responses to global health
    emergencies. The US was historically the largest funder, contributing approximately $400–900 million annually.
  term_1_date: '2020-07-06'
  term_1_effective: '2021-07-06'
  biden_rejoined: '2021-01-20'
  term_2_date: '2025-01-20'
  term_2_effective: null
  current_status: withdrawn_twice
  notes: Announced withdrawal in July 2020 during COVID-19 pandemic, citing WHO's handling of China's initial outbreak. Biden
    reversed immediately on day one. Trump re-withdrew on day one of Term 2. The second withdrawal left the US without representation
    in global health emergency coordination. Budget shortfalls at WHO followed US departure.
- id: jcpoa
  agreement: Joint Comprehensive Plan of Action (JCPOA) — Iran Nuclear Deal
  category: nuclear
  summary: 2015 multilateral agreement between Iran and the P5+1 (US, UK, France, Germany, Russia, China) limiting Iran's
    nuclear programme in exchange for sanctions relief. Described by Trump as the worst deal ever made.
  term_1_date: '2018-05-08'
  term_1_effective: '2018-05-08'
  biden_rejoined: null
  term_2_date: null
  term_2_effective: null
  current_status: never_rejoined
  notes: Biden attempted to re-enter the JCPOA through 2021–2022 negotiations but failed. Iran's nuclear programme advanced
    substantially under maximum pressure — enriching uranium to 60% purity. In February 2026, US-Israeli strikes hit Iranian
    nuclear facilities, and ceasefire-adjacent negotiations for a new deal began — on terms critics note are less favourable
    than the original JCPOA.
- id: inf-treaty
  agreement: Intermediate-Range Nuclear Forces (INF) Treaty
  category: nuclear
  summary: 1987 bilateral arms control treaty between the US and Soviet Union, eliminating an entire class of nuclear-capable
    missiles. A landmark of Cold War arms reduction. Signed by Reagan and Gorbachev.
  term_1_date: '2019-02-02'
  term_1_effective: '2019-08-02'
  biden_rejoined: null
  term_2_date: null
  term_2_effective: null
  current_status: never_rejoined
  notes: Trump cited Russian violations of the treaty as justification. Withdrawal triggered a new arms development race.
    Russia also formally suspended the treaty. Neither Biden nor Trump Term 2 sought to restore it. The collapse of the INF
    Treaty removed a 32-year constraint on medium-range nuclear weapons in Europe.
- id: open-skies
  agreement: Treaty on Open Skies
  category: security
  summary: 34-nation treaty allowing signatories to conduct unarmed aerial surveillance flights over each other's territory,
    providing military transparency. Signed 1992. US-Russia trust-building mechanism.
  term_1_date: '2020-05-22'
  term_1_effective: '2020-11-22'
  biden_rejoined: null
  term_2_date: null
  term_2_effective: null
  current_status: never_rejoined
  notes: Biden chose not to re-enter after Russia withdrew in retaliation for the US departure. The treaty effectively collapsed.
    European allies expressed dismay at the US withdrawal, which they argued removed transparency mechanisms while providing
    no leverage over Russia.
- id: new-start
  agreement: New START (Strategic Arms Reduction Treaty)
  category: nuclear
  summary: 2010 bilateral US-Russia treaty limiting deployed strategic nuclear warheads to 1,550 per side and delivery systems
    to 700. The last remaining major nuclear arms control treaty between the two largest nuclear powers.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2023-02-21'
  term_2_effective: null
  current_status: withdrawn
  notes: Russia suspended New START in February 2023, not the US — but the Trump administration made no effort to restore
    it upon returning to office in 2025, despite New START expiring in February 2026. The lapse leaves no bilateral nuclear
    arms control agreement in force between the US and Russia for the first time since 1972.
- id: tpp
  agreement: Trans-Pacific Partnership (TPP)
  category: trade
  summary: Twelve-nation free trade agreement covering 40% of the global economy, negotiated under Obama. Intended to counter
    China's economic influence in the Asia-Pacific through US-led trade architecture.
  term_1_date: '2017-01-23'
  term_1_effective: '2017-01-23'
  biden_rejoined: null
  term_2_date: null
  term_2_effective: null
  current_status: never_rejoined
  notes: Trump withdrew on day three of Term 1. The remaining eleven nations proceeded without the US as the Comprehensive
    and Progressive Agreement for Trans-Pacific Partnership (CPTPP). China subsequently applied to join CPTPP. Trade experts
    widely noted the withdrawal ceded US economic influence in the Asia-Pacific to China — the opposite of the stated intent.
- id: unesco
  agreement: UNESCO (UN Educational, Scientific and Cultural Organization)
  category: multilateral
  summary: UN agency promoting international cooperation in education, science, culture, and communication. Administers the
    World Heritage Sites programme. Founded 1945. The US rejoined under Biden in 2023 after a six-year absence.
  term_1_date: '2017-10-12'
  term_1_effective: '2018-12-31'
  biden_rejoined: '2023-07-11'
  term_2_date: '2025-07-22'
  term_2_effective: null
  current_status: withdrawn_twice
  notes: First withdrawal cited Palestinian membership and alleged anti-Israel bias. Biden spent political capital and funds
    to rejoin in 2023. Trump withdrew again in July 2025, again citing anti-Israel bias and 'woke' causes. 26 US World Heritage
    Sites, including the Statue of Liberty, fall under UNESCO oversight. US arrears from Term 1 and Term 2 departures now
    exceed $600 million.
- id: un-human-rights-council
  agreement: UN Human Rights Council (UNHRC)
  category: multilateral
  summary: UN body responsible for promoting and protecting human rights globally. 45 member states serving rotating three-year
    terms. Established 2006. The US was historically one of its most active members.
  term_1_date: '2018-06-19'
  term_1_effective: '2018-06-19'
  biden_rejoined: '2021-10-14'
  term_2_date: '2025-01-28'
  term_2_effective: null
  current_status: withdrawn_twice
  notes: Both withdrawals cited disproportionate focus on Israel and membership of authoritarian states. Critics noted the
    withdrawal removed the US from the room where human rights accountability was debated. Biden rejoined to re-engage from
    within. Trump re-withdrew one week into Term 2.
- id: un-global-compact-migration
  agreement: UN Global Compact for Safe, Orderly and Regular Migration
  category: multilateral
  summary: Non-binding international framework for international cooperation on migration. Adopted December 2018 by 164 countries.
    Covers 23 objectives for managing migration. Not a treaty.
  term_1_date: '2017-12-02'
  term_1_effective: '2017-12-02'
  biden_rejoined: null
  term_2_date: null
  term_2_effective: null
  current_status: never_rejoined
  notes: The US withdrew before the Compact was even finalised. One of the first Trump Term 1 multilateral withdrawals. Biden
    did not formally rejoin. The US remains outside the framework. The withdrawal was announced by then-UN Ambassador Nikki
    Haley.
- id: un-population-fund
  agreement: UN Population Fund (UNFPA)
  category: multilateral
  summary: UN agency delivering reproductive health and family planning services in 150 countries. Largest international provider
    of sexual and reproductive health services. US historically a major donor.
  term_1_date: '2017-04-03'
  term_1_effective: '2017-04-03'
  biden_rejoined: '2021-01-20'
  term_2_date: '2025-01-20'
  term_2_effective: null
  current_status: withdrawn_twice
  notes: Defunded in both Trump terms under the Kemp-Kasten Amendment, citing alleged support for coercive abortion programmes
    in China — a claim UNFPA disputes and international auditors have not substantiated. Biden restored funding immediately.
    Trump defunded again on day one of Term 2. UNFPA serves approximately 146 million women in developing countries.
- id: venice-commission
  agreement: Venice Commission (Council of Europe)
  category: multilateral
  summary: Council of Europe advisory body on constitutional law, providing legal opinions to strengthen democratic institutions.
    62 member states including non-EU democracies. Founded 1990.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: null
  current_status: withdrawn
  notes: Included in the January 2026 executive order withdrawing from 66 organisations. The Venice Commission advises governments
    on electoral and constitutional law — including advising on democratic backsliding. Rubio described it as contrary to
    US interests.
- id: freedom-online-coalition
  agreement: Freedom Online Coalition
  category: multilateral
  summary: Intergovernmental coalition of 36 countries dedicated to advancing internet freedom globally. Co-founded by the
    United States. Works to counter censorship and surveillance by authoritarian states.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: null
  current_status: withdrawn
  notes: Included in the January 2026 executive order. The US co-founded this coalition. Withdrawal from a body dedicated
    to internet freedom was noted as particularly incongruous by international press freedom organisations.
- id: global-counterterrorism-forum
  agreement: Global Counterterrorism Forum (GCTF)
  category: security
  summary: Multilateral counterterrorism body with 30 member countries and the EU, co-founded by the US. Facilitates information
    sharing and capacity building on counterterrorism. Founded 2011.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: null
  current_status: withdrawn
  notes: Included in the January 2026 executive order. The US co-founded the GCTF. Withdrawal from a counterterrorism coordination
    body drew particular scrutiny from former national security officials who noted the US was ceding influence in an area
    it had previously led.
- id: ilo-governance
  agreement: International Labour Organization (ILO) — Governance Conventions
  category: labour
  summary: The ILO sets international labour standards. The US has ratified only 14 of 190 ILO conventions — the lowest rate
    among major economies. Trump's Term 2 further disengaged from ILO standard-setting processes.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2025-03-01'
  term_2_effective: null
  current_status: partial
  notes: US participation in ILO governance processes was significantly reduced in Term 2. Not a formal withdrawal from the
    ILO itself, but a material reduction in engagement and funding to specific ILO programmes on labour standards and migration.
    Included in broader DOGE-driven international organisation funding cuts.
- id: carbon-free-energy-compact
  agreement: 24/7 Carbon-Free Energy Compact
  category: environment
  summary: A voluntary initiative launched at COP26 in 2021 committing signatories — governments, utilities, and corporations
    — to match electricity consumption with carbon-free generation on an hourly basis by 2030. The US joined under Biden.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. US had joined in 2021 under the Biden administration. No prior Term
    1 involvement.
- id: colombo-plan
  agreement: Colombo Plan Council
  category: multilateral
  summary: An intergovernmental organisation established in 1951 to promote cooperative economic and social development in
    Asia and the Pacific. 27 member states. The US joined in 1951.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. One of the oldest regional development organisations in the Asia-Pacific.
    US membership dated from the organisation's founding year.
- id: commission-environmental-cooperation
  agreement: Commission for Environmental Cooperation (CEC)
  category: environment
  summary: A trilateral body established under the North American Agreement on Environmental Cooperation (NAAEC), the environmental
    side agreement to NAFTA/USMCA, to address transboundary environmental issues among Canada, Mexico, and the United States.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. The CEC was created as part of the NAFTA side agreements in 1994
    and continued under USMCA. Its withdrawal is formally inconsistent with US obligations under USMCA, which the Trump administration
    negotiated in its first term.
- id: education-cannot-wait
  agreement: Education Cannot Wait (ECW)
  category: health
  summary: A UN-hosted fund established in 2016 to deliver education in humanitarian emergencies and protracted crises. Funded
    primarily by donor governments. Disbursed approximately $1.5 billion between 2016 and 2024.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. The US was a significant donor. Withdrawal consistent with broader
    defunding of humanitarian multilateral mechanisms initiated in early 2025.
- id: european-centre-hybrid-threats
  agreement: European Centre of Excellence for Countering Hybrid Threats (Hybrid CoE)
  category: security
  summary: A Helsinki-based NATO- and EU-affiliated research and training centre established in 2017 to improve resilience
    against hybrid threats including disinformation, cyberattacks, and election interference. 33 participating nations.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. The centre focuses on Russian hybrid warfare tactics. Withdrawal
    follows a broader pattern of reducing US involvement in European security coordination outside direct NATO structures.
- id: forum-european-highway-research
  agreement: Forum of European National Highway Research Laboratories (FEHRL)
  category: multilateral
  summary: A Brussels-based organisation coordinating highway and transport infrastructure research across European national
    laboratories. US participation was via the Federal Highway Administration.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. Primarily a European body; US participation was an observer/associate
    arrangement. One of the less prominent withdrawals in the January 7 list.
- id: global-community-engagement-resilience-fund
  agreement: Global Community Engagement and Resilience Fund (GCERF)
  category: security
  summary: A Geneva-based fund established in 2014 to prevent and counter violent extremism at the community level. Provides
    grants to civil society organisations in at-risk countries. 14 donor nations.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. US was a significant donor. Withdrawal consistent with defunding
    of counter-extremism programmes that do not operate under direct US government control.
- id: global-forum-cyber-expertise
  agreement: Global Forum on Cyber Expertise (GFCE)
  category: security
  summary: A global platform established at the 2015 Global Conference on Cyberspace in The Hague to facilitate international
    cyber capacity building and cooperation. Over 180 member states, organisations, and private sector partners.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. Noted as inconsistent with the administration's preference for bilateral
    cybersecurity arrangements over multilateral frameworks.
- id: global-forum-migration-development
  agreement: Global Forum on Migration and Development (GFMD)
  category: multilateral
  summary: A state-led, informal, non-binding consultative forum established in 2007 to address the nexus between migration
    and development. Operates outside the formal UN system. 190 participating states.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. Withdrawal consistent with the administration's position on international
    migration governance frameworks, which it views as constraints on sovereign border policy.
- id: inter-american-institute-global-change
  agreement: Inter-American Institute for Global Change Research (IAI)
  category: environment
  summary: An intergovernmental scientific organisation established in 1992 under the Inter-American Convention to coordinate
    research on global environmental change in the Americas. 19 member states.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. The US was the host country and primary funder. Headquarters is in
    São José dos Campos, Brazil. Withdrawal leaves the institute's operational future uncertain.
- id: intergovernmental-forum-mining
  agreement: Intergovernmental Forum on Mining, Minerals, Metals, and Sustainable Development (IGF)
  category: environment
  summary: A voluntary multilateral forum with over 80 member governments focused on maximising the benefits of mining for
    sustainable development and minimising environmental and social impacts.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. Inclusion may reflect the "sustainable development" framing rather
    than objection to the mining sector itself, which the administration has actively promoted through domestic policy.
- id: ipbes
  agreement: Intergovernmental Science-Policy Platform on Biodiversity and Ecosystem Services (IPBES)
  category: environment
  summary: An independent intergovernmental body established in 2012 to assess the state of biodiversity globally, analogous
    in structure to the IPCC for climate. Provides the scientific evidence base for the Convention on Biological Diversity.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum alongside the IPCC. The US withdrawal removes one of the two largest
    funders from a body whose assessments underpin international biodiversity policy.
- id: iccrom
  agreement: International Centre for the Study of the Preservation and Restoration of Cultural Property (ICCROM)
  category: multilateral
  summary: A Rome-based intergovernmental organisation established in 1956 to promote the conservation and restoration of
    cultural heritage worldwide. 138 member states. The US was a founding member.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. No stated policy rationale specific to ICCROM. One of several cultural
    and heritage institutions in the January 7 list.
- id: international-cotton-advisory-committee
  agreement: International Cotton Advisory Committee (ICAC)
  category: trade
  summary: A Washington-based intergovernmental organisation founded in 1939 providing data, analysis, and technical assistance
    on the world cotton market. 26 member countries.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. The ICAC is headquartered in Washington, DC. US withdrawal from its
    own-hosted body leaves the organisation's location and funding structure in question.
- id: international-development-law-organization
  agreement: International Development Law Organization (IDLO)
  category: multilateral
  summary: A Rome-based intergovernmental organisation established in 1983 supporting rule-of-law development in low- and
    middle-income countries, including legal reform, judicial training, and access to justice programmes.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. IDLO programmes overlap in mandate with USAID rule-of-law initiatives,
    which were also defunded in 2025.
- id: international-energy-forum
  agreement: International Energy Forum (IEF)
  category: trade
  summary: A Riyadh-based intergovernmental body facilitating dialogue between energy-producing and consuming nations, including
    OPEC and IEA members. Provides a neutral platform for producer-consumer discussions on energy security and markets.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. IEF is one of the few multilateral energy bodies with active Gulf
    state participation. Withdrawal is broadly consistent with the administration's preference for bilateral energy diplomacy.
- id: ifacca
  agreement: International Federation of Arts Councils and Culture Agencies (IFACCA)
  category: multilateral
  summary: A global network of arts councils and government culture agencies promoting international cooperation in arts and
    cultural policy. Over 100 member organisations in 75 countries.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. US participation was through the National Endowment for the Arts.
    One of several cultural bodies included in the January 7 list.
- id: international-idea
  agreement: International Institute for Democracy and Electoral Assistance (IDEA)
  category: multilateral
  summary: A Stockholm-based intergovernmental organisation established in 1995 supporting sustainable democracy worldwide
    through research, technical assistance, and analysis of electoral systems. 35 member states.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. IDEA publishes the Global State of Democracy report. US withdrawal
    removes the largest non-European democracy from the organisation's membership.
- id: international-institute-justice-rule-of-law
  agreement: International Institute for Justice and the Rule of Law (IIJ)
  category: security
  summary: A Malta-based institution established in 2014 to train criminal justice practitioners from Africa and the Middle
    East on countering terrorism within a rule-of-law framework. Established with US support as part of the Global Counterterrorism
    Forum.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum alongside the Global Counterterrorism Forum, to which it is operationally
    linked. The US was the primary funder of both institutions.
- id: international-lead-zinc-study-group
  agreement: International Lead and Zinc Study Group (ILZSG)
  category: trade
  summary: A Lisbon-based intergovernmental body providing statistical data and analysis on the global lead and zinc industries.
    Established in 1959. 25 member countries accounting for approximately 85 percent of global production and consumption.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. A statistical and advisory body with no regulatory authority. One
    of the least prominent withdrawals in the January 7 list.
- id: international-solar-alliance
  agreement: International Solar Alliance (ISA)
  category: environment
  summary: An India- and France-initiated intergovernmental treaty organisation established at COP21 in 2015, focused on mobilising
    investment in solar energy for tropical nations. 124 signatory countries.
  term_1_date: null
  term_1_effective: null
  biden_rejoined: null
  term_2_date: '2026-01-07'
  term_2_effective: '2026-01-07'
  current_status: withdrawn
  notes: Withdrawn under the January 7, 2026 memorandum. US joined the ISA under Biden in 2021. The ISA is headquartered in
    Gurugram, India, and its mandate focuses on developing-world energy access rather than US domestic energy policy.
- id: international-tropical-timber-organization
  agreement: International Tropical Timber Organization (ITTO)
  category: environment
