- country: Turkey
  code: TR
  status: STATUS_UNCLEAR
  descriptor: NATO member. Complex. Erdogan assessed as strong leader.
  last_incident_date: "2025-01-20"
  last_incident: >
    Turkey's status remains difficult to classify. President Erdogan
    maintains a bilateral relationship that operates largely outside the
    standard NATO assessment framework.

- country: Poland
  code: PL
  status: ALLY_PROVISIONAL
  descriptor: NATO member. Defence spending: compliant. Assessed as reliable.
  last_incident_date: "2024-09-18"
  last_incident: >
    Poland was cited as an example of a NATO member meeting its defence
    spending obligations. This remains the basis of the relationship.

- country: Japan
  code: JP
  status: ALLY_PROVISIONAL
  descriptor: Major ally. Car tariffs under discussion. Personal relationship: good.
  last_incident_date: "2025-04-02"
  last_incident: >
    Japan was subjected to the reciprocal tariff announcement on April 2, 2025,
    with a 24 percent rate. Bilateral negotiations initiated. Relationship
    described as very strong.

- country: South Korea
  code: KR
  status: TARIFF_TARGET
  descriptor: Ally. Tariff subject. Defence cost-sharing under review.
  last_incident_date: "2025-04-02"
  last_incident: >
    South Korea was subjected to a 25 percent reciprocal tariff. Separate
    discussions regarding the cost of US military presence on the Korean
    peninsula are ongoing.

- country: Australia
  code: AU
  status: ALLY_PROVISIONAL
  descriptor: Five Eyes partner. Assessed as reliable. Tariff exemption: partial.
  last_incident_date: "2025-04-02"
  last_incident: >
    Australia was assessed a 10 percent tariff under the reciprocal tariff
    regime. The tariff rate is lower than for most nations, which the
    administration has not explained.

- country: India
  code: IN
  status: TARIFF_TARGET
  descriptor: Tariff target. Modi relationship: strong. Trade deficit: very unfair.
  last_incident_date: "2025-04-02"
  last_incident: >
    India was subjected to a 26 percent reciprocal tariff. The Prime Minister
    Modi relationship remains described as very good. The tariff and the
    relationship are not considered contradictory.

- country: Israel
  code: IL
  status: ALLY_PROVISIONAL
  descriptor: Primary ally. Embassy moved. Abraham Accords: claimed as own.
  last_incident_date: "2025-01-20"
  last_incident: >
    Israel was among the first nations confirmed as allies in the second term.
    The Abraham Accords, brokered in the first term, are described as the
    greatest deal in Middle Eastern history.

- country: Saudi Arabia
  code: SA
  status: ALLY_PROVISIONAL
  descriptor: Reliable partner. Understood from the outset. No questions asked.
  last_incident_date: "2025-01-20"
