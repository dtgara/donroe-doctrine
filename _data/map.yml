- country: Canada
  code: CA
  status: FOR_ACQUISITION
  descriptor: 51st state candidate. Status pending provincial consent.
  last_incident_date: "2025-03-15"
  last_incident: >
    President referred to the Canadian Prime Minister as "Governor" for the
    fourteenth consecutive public appearance. The Prime Minister of Canada
    has confirmed he is not the Governor of Canada.
  annexation_progress: 0
  purchase_status: null

- country: Greenland
  code: GL
  status: FOR_ACQUISITION
  descriptor: Prime Arctic real estate. Motivated seller being sought.
  last_incident_date: "2025-01-07"
  last_incident: >
    President confirmed renewed acquisition interest in Greenland, describing
    its possession as an absolute necessity for national security. This is
    the second such assessment; the first was made in August 2019 and
    subsequently described by the Danish Prime Minister as absurd.
  annexation_progress: null
  purchase_status: "Pending. Denmark has not engaged with offer terms."

- country: Denmark
  code: DK
  status: STATUS_UNCLEAR
  descriptor: Sovereign nation. Current status contingent on Greenland negotiations.
  last_incident_date: "2025-01-07"
  last_incident: >
    Denmark's status is contingent on the resolution of the Greenland acquisition
    question. The Danish government has declined to participate in the acquisition
    process. The relationship is described as under review.

- country: Mexico
  code: MX
  status: TARIFF_TARGET
  descriptor: Tariff subject. Border-adjacent. Governor of the fifty-second state.
  last_incident_date: "2025-02-01"
  last_incident: >
    Twenty-five percent tariffs announced on all Mexican imports, effective
    February 1, 2025. Tariffs suspended within days following discussions
    with the Mexican President. The tariffs remain available for redeployment.

- country: China
  code: CN
  status: ADVERSARY
  descriptor: Primary trade adversary. Very unfair. Years of ripping us off.
  last_incident_date: "2025-04-02"
  last_incident: >
    Tariffs on Chinese goods raised to 145 percent following China's retaliatory
    measures. The situation is described as reciprocal. The rate reflects the
    doctrine's assessment of cumulative unfairness across both administrations.

- country: Russia
  code: RU
  status: ALLY_PROVISIONAL
  descriptor: Important country. Very powerful leader. Excellent personal chemistry.
  last_incident_date: "2025-02-12"
  last_incident: >
    President held direct telephone call with President Putin to discuss a
    ceasefire in Ukraine. The call was described as very productive. Ukraine
    was not present for the call.

- country: Ukraine
  code: UA
  status: STATUS_UNCLEAR
  descriptor: Sovereign nation. Ongoing. Status subject to negotiation outcomes.
  last_incident_date: "2025-02-28"
  last_incident: >
    President Zelensky attended the White House for discussions regarding
    rare earth minerals and ceasefire terms. The meeting concluded without
    a signed agreement. The Oval Office exchange was widely covered.

- country: United Kingdom
  code: GB
  status: ALLY_PROVISIONAL
  descriptor: Special relationship. Current status: special, with caveats.
  last_incident_date: "2025-01-20"
  last_incident: >
    The United Kingdom was among the first nations to be assessed following
    the commencement of the second term. The special relationship was
    reaffirmed. Tariff status remains to be determined.

- country: Germany
  code: DE
  status: TARIFF_TARGET
  descriptor: NATO member. Paid insufficiently. Trade surplus assessed as unfair.
  last_incident_date: "2025-04-02"
  last_incident: >
    Germany, as a member of the European Union, was subjected to the
    reciprocal tariff regime announced on April 2, 2025. The EU's trade
    surplus with the United States was described as tremendous and deliberate.

- country: France
  code: FR
  status: TARIFF_TARGET
  descriptor: NATO member. Wine tariffs considered. Macron relationship: variable.
  last_incident_date: "2025-04-02"
  last_incident: >
    France, as a member of the European Union, was subjected to the
    reciprocal tariff regime announced on April 2, 2025.

