# World Map — Country Status Data
# Schema: country, code (ISO 3166-1 alpha-2), status, descriptor,
#         last_incident_date, last_incident
# Special fields: annexation_progress (Canada only), purchase_status (Greenland only)
#
# Status values:
#   ALLY_PROVISIONAL   — currently in favour, subject to change without notice
#   ADVERSARY          — actively threatened, sanctioned, or insulted
#   FOR_ACQUISITION    — subject to purchase or annexation interest
#   TARIFF_TARGET      — no personal animosity, purely economic hostility
#   IGNORED            — not yet relevant to the doctrine
#   STATUS_UNCLEAR     — position changed too recently to categorise
#
# Priority country entries (non-IGNORED) added from Day 2 onwards.
# This file seeds all IGNORED entries for Day 1.

