title: "The Donroe Doctrine"
description: >
  Documenting Trump's foreign policy doctrine, 2017–present. Contradiction tracker,
  deal log, cables, leaderboard, quote archive, tariff calculator, and two daily games.
url: "https://donroedoctrine.com"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/

# Collections
collections:
  cables:
    output: true
    permalink: /cables/:name/
  deals:
    output: true
    permalink: /deals/:name/
  estimates:
    output: true
    permalink: /estimates/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "cables"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "deals"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "estimates"
    values:
      layout: "estimate"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - push_to_github.py
  - vendor/
